<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scanner / Generator with Auto Camera & Touch-to-Unlock Audio</title>
  <!-- Materialize CSS (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }
    /* "Send" button: big for easy tapping */
    #sendBtn {
      position: absolute;
      font-size: 600% !important;
    }
    /* hide & disable Send (still usable programmatically) */
    #sendBtn {
    display: none !important;
    pointer-events: none !important;
    }
    /* #qrcode: resizable by config */
    #qrcode {
      position: absolute;
    }
    /* Scanned QR Code text box: big font */
    #orderNumInput {
      position: absolute;
      background: #f9f9f9;
      width: 900px !important;
      height: 150px !important;
      font-size: 600% !important;
    }
    #orderLabel {
      position: absolute;
      font-weight: bold;
      font-size: 600% !important;
    }
    #qrPreviewTitle {
      position: absolute;
      font-weight: bold;
      font-size: 600% !important;
    }
    #openConfigBtnScanner {
      position: absolute;
    }
    #video {
      position: absolute;
      background: #333;
    }
    #captureCanvas {
      position: absolute;
      display: none;
    }
    /* Modal styling for config */
    .modal {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      height: auto !important;
      max-height: 70vh !important;
      width: auto !important;
      max-width: 650px !important;
      overflow-y: auto !important;
    }
    .modal .modal-content {
      font-size: 0.9em;
      text-align: left;
    }
    .modal .modal-footer {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      padding: 10px;
      background: white;
      font-size: 0.9em;
    }
    table.striped {
      width: 100%;
    }
    table.striped th,
    table.striped td {
      padding: 8px;
      text-align: center;
    }
    input[type="number"] {
      width: 70px;
      font-size: 0.8em;
    }
  </style>
</head>
<body>
  <!-- "Open Config" button -->
  <button id="openConfigBtnScanner" class="btn waves-effect waves-light">
    Open Config
  </button>

  <!-- "Order #:" label -->
  <div id="orderLabel">Order #:</div>

  <!-- Scanned code text box -->
  <input type="text" id="orderNumInput" placeholder="(Scanned QR Code)" readonly />

  <!-- "QR Code" title -->
  <div id="qrPreviewTitle">QR Code</div>

  <!-- Container for generated QR code -->
  <div id="qrcode"></div>

  <!-- Video feed -->
  <video id="video" playsinline></video>
  
  <!-- Hidden canvas for scanning frames -->
  <canvas id="captureCanvas" width="640" height="480" style="display:none;"></canvas>

  <!-- "Send" button -->
  <button id="sendBtn" class="btn waves-effect waves-light">Send</button>

  <!-- Config Modal -->
  <div id="configModalScanner" class="modal">
    <div class="modal-content">
      <h5>Layout Config</h5>
      <table class="striped" id="configTableScanner">
        <thead>
          <tr>
            <th>Component</th>
            <th>Left (px)</th>
            <th>Top (px)</th>
            <th>Width (px)</th>
            <th>Height (px)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="modal-footer">
      <button id="saveConfigBtnScanner" class="modal-close btn">Save Config</button>
    </div>
  </div>

  <!-- Local libs for QR scanning & generation -->
  <script src="lib/qrcode.min.js"></script>
  <script src="lib/jsQR.js"></script>
  <!-- Materialize JS (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <!-- Firebase (compat mode) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    /*************************************************************
     * 0) FIREBASE CONFIG (Adjust if needed)
     *************************************************************/
    const firebaseConfig = {
      apiKey: "YourApiKeyHere",
      authDomain: "YourAuthDomainHere",
      projectId: "gokudatabase",
      storageBucket: "gokudatabase.firebasestorage.app",
      messagingSenderId: "1078662308113",
      appId: "1:1078662308113:web:41df0e5d229ff2af7a6cb0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    /*************************************************************
     * 1) GLOBAL VARIABLES
     *************************************************************/
    let stream = null;
    let scanningInterval = null;
    let lastScanned = "";
    let rescanWhenGone = "", codeGone = 0;   // see "desk presence" below
    let audioUnlocked = false; // We'll beep only if this is true
    let audioCtx = null;       // For Web Audio API

    const video        = document.getElementById("video");
    const canvas       = document.getElementById("captureCanvas");
    const ctx          = canvas.getContext("2d");
    const scannedInput = document.getElementById("orderNumInput");
    const qrcodeDiv    = document.getElementById("qrcode");

    // Use your external MP3 beep from the assets folder
    const beepSound = new Audio("./assets/scannerBeep.mp3");
    beepSound.preload = "auto";
    beepSound.load();

    /*************************************************************
     * 2) PLAY BEEP USING THE MP3 FILE WITH ADJUSTED PARAMETERS
     *************************************************************/
    function playBeep() {
      // If AudioContext is available, use it with modified parameters:
      if (audioCtx) {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = "sine";
        // Increase frequency by 33% twice: 440 Hz * 1.33 * 1.33 ≈ 778 Hz
        oscillator.frequency.setValueAtTime(440 * 1.33 * 1.33, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        oscillator.start();
        // Shorten playback time by 33% twice: 0.2 sec * 0.67 * 0.67 ≈ 0.09 sec
        oscillator.stop(audioCtx.currentTime + 0.2 * 0.67 * 0.67);
      } else {
        // Fallback using the Audio element: set playback rate to 1.33 * 1.33 ≈ 1.77
        beepSound.playbackRate = 1.33 * 1.33;
        beepSound.currentTime = 0;
        beepSound.play().catch(e => console.warn("Beep fallback error:", e));
      }
    }

    /*************************************************************
     * 3) START CAMERA AUTOMATICALLY
     *************************************************************/
    async function startCamera() {
      try {
        // Request environment-facing camera
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = stream;
        video.play();

        // Continuously scan every 500ms
        scanningInterval = setInterval(() => {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const qrResult = jsQR(frame.data, frame.width, frame.height);
          if (qrResult) {
            codeGone = 0;
            handleScannedCode(qrResult.data);
          } else if (rescanWhenGone && ++codeGone >= 3) {
            // the code that went to a desk nobody was signed in at has been out of view for 1.5 s: showing it again is a new scan
            if (lastScanned === rescanWhenGone) lastScanned = "";
            rescanWhenGone = ""; codeGone = 0;
          }
        }, 500);
      } catch (err) {
        console.error("Camera error:", err);
        alert("Could not start camera: " + err.message);
      }
    }

    /*************************************************************
     * 4) HANDLE A NEW QR CODE SCAN
     *************************************************************/
    function handleScannedCode(codeText) {
      if (codeText === lastScanned) return;
      lastScanned = codeText;

      // If audio is unlocked, play the beep using your MP3 with adjusted parameters
      if (audioUnlocked) {
        playBeep();
      }

      // Display the scanned code
      scannedInput.value = codeText;

      // Render a new QR code in the qrcode container
      qrcodeDiv.innerHTML = "";
      const containerStyles = window.getComputedStyle(qrcodeDiv);
      const containerWidth  = parseInt(containerStyles.width, 10)  || 128;
      const containerHeight = parseInt(containerStyles.height, 10) || 128;
      new QRCode(qrcodeDiv, {
        text: codeText,
        width: containerWidth,
        height: containerHeight
      });

     M.toast({ html: "Scanned: " + codeText });
     // Auto fire "Send" logic
     pushScannedToFirestore(codeText);
    }

    /*************************************************************
     * 5) UNLOCK AUDIO ON FIRST TOUCH OR CLICK
     *************************************************************/
    function unlockAudio() {
      // Try initializing/resuming the AudioContext
      if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx) {
        audioCtx.resume().then(() => {
          audioUnlocked = true;
          M.toast({ html: "Audio unlocked via Web Audio API. Beeps will now play." });
        }).catch(e => {
          console.warn("AudioContext resume error:", e);
          // Fallback: try playing the MP3 file with fallback settings
          beepSound.currentTime = 0;
          beepSound.playbackRate = 1.33 * 1.33;
          beepSound.play().then(() => {
            audioUnlocked = true;
            M.toast({ html: "Audio unlocked via MP3 fallback. Beeps will now play." });
          }).catch(err => {
            console.warn("Fallback audio play error:", err);
            M.toast({ html: "Audio still blocked – check your volume/silent mode." });
          });
        });
      } else {
        // If no AudioContext, fallback to MP3 directly
        beepSound.currentTime = 0;
        beepSound.playbackRate = 1.33 * 1.33;
        beepSound.play().then(() => {
          audioUnlocked = true;
          M.toast({ html: "Audio unlocked via MP3 fallback. Beeps will now play." });
        }).catch(err => {
          console.warn("Fallback audio play error:", err);
          M.toast({ html: "Audio still blocked – check your volume/silent mode." });
        });
      }
      // Remove the listeners after first interaction
      window.removeEventListener("touchstart", unlockAudio);
      window.removeEventListener("click", unlockAudio);
    }
    // Attach unlock event listeners to window (covers mobile and desktop)
    window.addEventListener("touchstart", unlockAudio, { once: true });
    window.addEventListener("click", unlockAudio, { once: true });

    /*************************************************************
     * 6) SEND LOGIC (reusable)
     *************************************************************/
    const sendBtn = document.getElementById("sendBtn");
    sendBtn.disabled = true; // hidden & disabled, but kept for config integrity

    /* A scan goes to this station's desktop (assembly-2.html) through the Firestore document 'assembly-scan-2', where the desktop
       credits it to the person signed in there (this phone has no sign-in). One that could not be sent (no network, a busy server) is
       KEPT and sent again, oldest first and one at a time, until the station has it: it is never lost while this page is open, and it
       survives a reload of the page (order numbers only, in sessionStorage; one older than 30 minutes is dropped as stale). */
    const RELAY_DOC = "assembly-scan-2";
    const OUTBOX_KEY = "assemblyScanOutbox." + RELAY_DOC;
    let outbox = [], relaying = false, retryTimer = 0, relayTries = 0;
    function saveOutbox() {
      try { if (outbox.length) sessionStorage.setItem(OUTBOX_KEY, JSON.stringify(outbox)); else sessionStorage.removeItem(OUTBOX_KEY); } catch (_) {}
    }
    function loadOutbox() {
      try {
        const kept = JSON.parse(sessionStorage.getItem(OUTBOX_KEY) || "[]");
        if (Array.isArray(kept)) outbox = kept.filter(x => x && typeof x.c === "string" && x.c && Date.now() - (Number(x.at) || 0) < 30 * 60000).slice(-20);
      } catch (_) {}
    }
    /* Desk presence. A scan counts only when the desk page (assembly-N.html) is open AND somebody is signed in there; this phone has no sign-in of its
       own, so after a scan it asks the shop (firebaseOrders ?deskFor=, which reads the desk's own sign-in record: a yes or no, never a name) and says so
       plainly when nobody is. "out" = the shop says nobody is signed in at this desk, "in" = somebody is, "unknown" = this phone could not find out (no
       network, an older shop): then it says nothing extra. A scan sent while the answer is "out" says so in the same write ("no desk signed in"), which
       lets a desk that opens within 10 minutes pick it up (assembly-N.html) instead of losing it. */
    const DESK_DEVICE = RELAY_DOC.replace("-scan-", "-");                 // assembly-scan-2 -> assembly-2
    const DESK_NAME = "Assembly " + DESK_DEVICE.split("-").pop();
    let deskState = "unknown", deskAt = 0;
    async function deskCheck(maxAgeMs) {
      if (deskState !== "unknown" && Date.now() - deskAt < maxAgeMs) return deskState;
      let timer = 0;
      try {
        const ctl = typeof AbortController === "function" ? new AbortController() : null;
        timer = ctl ? setTimeout(() => ctl.abort(), 3000) : 0;
        const response = await fetch("/.netlify/functions/firebaseOrders?deskFor=" + encodeURIComponent(DESK_DEVICE) + "&t=" + Date.now(), { cache: "no-store", signal: ctl ? ctl.signal : undefined });
        const result = response.ok ? await response.json() : null;
        deskState = result && result.success === true && typeof result.signedIn === "boolean" ? (result.signedIn ? "in" : "out") : "unknown";
      } catch (_) { deskState = "unknown"; }
      if (timer) clearTimeout(timer);
      deskAt = Date.now();
      return deskState;
    }
    function deskToast(thisScan) {
      M.toast({ html: "Nobody is signed in at the " + DESK_NAME + " desk. Sign in there so " + (thisScan ? "this scan counts." : "your scans count."), displayLength: 15000, classes: "orange darken-3" });
    }

    /** one write of one scan: "sent", "retry" (no network, 5xx, 429, 408) or "drop" (the station's door refused it for good) */
    async function relayOnce(codeVal, desk) {
      const bodyData = {
        orderNumber: RELAY_DOC,
        orderNumField: codeVal,
        clientName: "Scanner Page",
        britesMessages: "(Auto push from assembly-scan-2.html" + (desk === "out" ? "; no desk signed in" : "") + ")",
        shippingLabelTimestamps: new Date().toISOString(),
        employeeName: "ScannerBot"
      };
      try {
        const response = await fetch("/.netlify/functions/firebaseOrders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bodyData)
        });
        let result = null; try { result = await response.json(); } catch (_) {}
        if (response.ok) return "sent";
        console.error("Error sending to Firestore:", response.status, result && result.error);
        return response.status >= 500 || response.status === 429 || response.status === 408 ? "retry" : "drop";
      } catch (err) {
        console.error("Error sending to Firestore:", err);
        return "retry";
      }
    }
    async function relayPump() {
      if (relaying) return;
      relaying = true;
      try {
        while (outbox.length) {
          const code = outbox[0].c;
          M.toast({ html: "Sending to Firestore doc '" + RELAY_DOC + "': " + code });
          const desk = await deskCheck(4000);                   // asked before the write (an answer under 4 s old is reused), so the scan can carry it
          const r = await relayOnce(code, desk);
          if (r === "retry") {
            relayTries++;
            M.toast({ html: "Not sent yet, trying again: " + code });
            clearTimeout(retryTimer);
            retryTimer = setTimeout(relayPump, Math.min(15000, 2000 * Math.pow(2, Math.min(relayTries, 4) - 1)));   // 2, 4, 8, 15 s
            return;
          }
          outbox.shift(); saveOutbox(); relayTries = 0;
          if (r === "sent") {
            M.toast({ html: "Firestore updated: doc '" + RELAY_DOC + "' => " + code });
            if (desk === "out") { deskToast(true); rescanWhenGone = code; }   // sent, but nobody is signed in at the desk: say so, and let the same code be scanned again once the desk has someone
          } else { M.toast({ html: "Error: the station did not accept " + code }); if (lastScanned === code) lastScanned = ""; }   // it can be scanned again
          if (outbox.length) await new Promise(res => setTimeout(res, 800));       // the desktop reads one scan at a time
        }
      } finally { relaying = false; }
    }
    async function pushScannedToFirestore(codeVal) {
      if (!codeVal) {
        M.toast({ html: "No QR code scanned yet!" });
        return;
      }
      outbox.push({ c: String(codeVal), at: Date.now() });
      if (outbox.length > 20) outbox.shift();
      saveOutbox();
      relayPump();
    }
    window.addEventListener("online", () => { clearTimeout(retryTimer); relayPump(); });
    loadOutbox();
    if (outbox.length) setTimeout(relayPump, 500);

    /*************************************************************
     * 7) CONFIG SYSTEM FOR LAYOUT REPOSITIONING
     *************************************************************/
    const scannerConfigComponentIDs = [
      "openConfigBtnScanner",
      "orderLabel",
      "orderNumInput",
      "qrPreviewTitle",
      "qrcode",
      "video",
      "captureCanvas",
      "sendBtn"
    ];
    let scannerDefaultPositions = {
      openConfigBtnScanner: { left:1600, top:2600, width:141, height:36 },
      orderLabel:           { left:70,   top:2450,  width:450, height:25 },
      orderNumInput:        { left:70,   top:2585,  width:450, height:75 },
      qrPreviewTitle:       { left:70,   top:2850,  width:350, height:25 },
      qrcode:               { left:70,   top:3000,  width:384, height:384 },
      video:                { left:0,    top:0,     width:1800, height:2400 },
      captureCanvas:        { left:400,  top:2600,  width:300, height:200 },
      sendBtn:              { left:1150, top:2820,  width:550, height:225 }
    };
    function loadPositionsFromStorage() {
      const stored = localStorage.getItem("scannerPositions");
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          for (let id of scannerConfigComponentIDs) {
            if (parsed[id]) {
              scannerDefaultPositions[id] = parsed[id];
            }
          }
        } catch(e) {
          console.warn("Could not parse scannerPositions from storage:", e);
        }
      }
    }
    function applyPositions() {
      scannerConfigComponentIDs.forEach(id => {
        const coords = scannerDefaultPositions[id];
        const el = document.getElementById(id);
        if (!coords || !el) return;
        el.style.position = "absolute";
        el.style.left   = coords.left + "px";
        el.style.top    = coords.top  + "px";
        el.style.width  = coords.width + "px";
        el.style.height = coords.height + "px";
      });
    }
    function scannerPopulateConfigTable() {
      const tbody = document.getElementById("configTableScanner").querySelector("tbody");
      tbody.innerHTML = "";
      scannerConfigComponentIDs.forEach(id => {
        const coords = scannerDefaultPositions[id];
        const el = document.getElementById(id);
        if (!coords || !el) return;
        const compName = (el.textContent && el.textContent.trim()) || el.placeholder || id;
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${compName}</td>
          <td><input type="number" value="${coords.left}" data-id="${id}" data-prop="left"></td>
          <td><input type="number" value="${coords.top}" data-id="${id}" data-prop="top"></td>
          <td><input type="number" value="${coords.width}" data-id="${id}" data-prop="width"></td>
          <td><input type="number" value="${coords.height}" data-id="${id}" data-prop="height"></td>
        `;
        tbody.appendChild(row);
        row.querySelectorAll("input").forEach(inp => {
          inp.addEventListener("input", function() {
            const tgtId = this.getAttribute("data-id");
            const prop = this.getAttribute("data-prop");
            const newVal = parseInt(this.value, 10) || 0;
            scannerDefaultPositions[tgtId][prop] = newVal;
            applyPositions();
          });
        });
      });
    }
    function scannerSaveConfiguration() {
      localStorage.setItem("scannerPositions", JSON.stringify(scannerDefaultPositions));
      console.log("Scanner layout saved!");
      M.toast({ html: "Scanner layout saved!" });
    }
    document.addEventListener("DOMContentLoaded", function() {
      // Initialize Materialize
      M.AutoInit();
      // Load and apply stored positions
      loadPositionsFromStorage();
      applyPositions();
      // Start the camera scanning automatically
      startCamera();
      // Tell the assembler at once when nobody is signed in at the desk
      setTimeout(async () => { if (await deskCheck(0) === "out") deskToast(false); }, 1500);
      // Hook up "Open Config" button to show config modal
      document.getElementById("openConfigBtnScanner").addEventListener("click", () => {
        scannerPopulateConfigTable();
        const modalElem = document.getElementById("configModalScanner");
        const instance = M.Modal.getInstance(modalElem);
        instance.open();
      });
      // Hook up "Save Config" button
      document.getElementById("saveConfigBtnScanner").addEventListener("click", scannerSaveConfiguration);
    });
  </script>
</body>
</html>
