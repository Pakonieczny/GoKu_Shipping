<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- ce-import fixture: a 30 x 20 mm tag drawn in millimetres (Inkscape's way: width and height in mm, a viewBox in the same units).
     CUT: the rounded outline and a 2.5 mm hole; ENGRAVE: a red line (an arc written with its flags run together, a quadratic, a smooth quadratic and a smooth cubic),
     a blue dot and a black triangle turned 30 degrees; a live text that is left out. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="30mm" height="20mm" viewBox="0 0 30 20" version="1.1">
  <style>
    .red { stroke: #e30613; fill: none; stroke-width: 0.2 }
    .blue { fill: #0000ff }
  </style>
  <g inkscape:groupmode="layer" inkscape:label="CUT" id="layer1">
    <rect id="rect10" x="0" y="0" width="30" height="20" rx="3" fill="none" stroke="#000" stroke-width="0.1"/>
    <circle cx="4" cy="4" r="1.25" style="fill:none;stroke:black;stroke-width:0.1"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="ENGRAVE" id="layer2">
    <path class="red" id="wave" d="M8 12a3 3 0 116 0q2 3 4 0t4 0s2-2 3 0"/>
    <circle class="blue" cx="22" cy="6" r="2"/>
    <polygon points="10,15 12,18 8,18" fill="#000" transform="rotate(30 10 16.5)"/>
  </g>
  <text x="5" y="5" font-size="3">Hello</text>
</svg>
