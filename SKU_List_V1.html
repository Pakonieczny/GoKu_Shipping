<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Etsy Listings</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 0; background:#0a0a0a; color:#eee;}
    header { position: sticky; top:0; background:#111; border-bottom:1px solid #222; padding:10px 16px; display:flex; gap:8px; align-items:center; z-index:10;}
    .btn { background:#2962ff; color:#fff; border:0; border-radius:8px; padding:10px 14px; cursor:pointer; font-weight:600;}
    .btn:disabled { opacity:.6; cursor:default;}
    .btn.secondary { background:#333; }
    /* toggle state for filter button */
    .btn.active { background:#00695c; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:12px; padding:16px; }
    .card { background:#121212; border:1px solid #222; border-radius:14px; overflow:hidden; display:flex; flex-direction:column; }

    /* image frame: fixed square so every card matches and zoom stays clipped */
    .thumb-wrap{
      position:relative;
      width:100%;
      aspect-ratio: 1 / 1;
      overflow:hidden;
      background:#151515;
    }
    /* base image state: fit fully, not cropped; start at scale(1) */
    .thumb{
      width:100%;
      height:100%;
      object-fit: contain;           /* was cover (appears “zoomed”) */
      background:#151515;
      user-select:none;
      display:block;
      transform: scale(1);           /* explicit baseline */
      transform-origin: var(--ox, 50%) var(--oy, 50%);
      transition: transform .05s linear;
    }

    /* green checkmark box */
    .selectBox {
      width: 18px;
      height: 18px;
      accent-color: #2e7d32; /* modern browsers: green check */
      cursor: pointer;
    }

    /* selected card highlight */
    .card.selected {
      outline: 2px solid #2e7d32;
      outline-offset: -1px;
    }
    .meta { padding:12px; display:flex; flex-direction:column; gap:6px; }
    .title { font-size:14px; line-height:1.3; color:#fafafa; font-weight:600; }
    .sku { font-size:12px; color:#bbb; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .pill { font-size:12px; padding:4px 8px; border-radius:999px; border:1px solid #2a2a2a; color:#cfcfcf; }
    .status { margin-left:auto; font-size:12px; color:#9ad; }
    .status.bad { color:#ff8a80; }
    .status.ok  { color:#7ddf8a; }
    footer { position: sticky; bottom:0; background:#111; border-top:1px solid #222; padding:10px 16px; display:flex; gap:8px; align-items:center; }
    .pagebox { margin-left:auto; color:#aaa; }
    input[type="number"]{ background:#181818; color:#ddd; border:1px solid #2a2a2a; border-radius:8px; padding:8px; width:90px;}
    .search { flex: 1; }
    .search input { width:100%; background:#181818; color:#ddd; border:1px solid #2a2a2a; border-radius:8px; padding:10px 12px; }
    .notice { margin:16px; padding:12px 14px; border:1px solid #2a2a2a; border-radius:12px; background:#141414; color:#ddd; font-size:13px; }
  </style>
</head>
<body>

  <header>
    <button id="connectEtsyBtn" class="btn">Connect Etsy</button>
    <button id="refreshBtn" class="btn secondary">Refresh</button>

    <button id="filterCompleteBtn" class="btn secondary" title="Show only items without the green checkmark">Filter Complete</button>

    <div class="search">
      <input id="searchInput" placeholder="Filter by title… (client-side)" />
    </div>

    <span id="authStatus" class="status">Not connected</span>
  </header>

  <main id="listContainer" class="grid" aria-live="polite"></main>

  <footer>
    <button id="prevBtn" class="btn secondary">Prev</button>
    <button id="nextBtn" class="btn">Next</button>
    <span class="pagebox">
      Page <span id="pageNum">1</span>
      &nbsp;•&nbsp; Page size
      <input id="pageSize" type="number" min="1" max="100" value="100" />
      &nbsp;•&nbsp; Go to
      <input id="pageJump" type="number" min="1" placeholder="Page" />
      <button id="goBtn" class="btn secondary">Go</button>
    </span>
  </footer>

<script>
/** ============ Hard domain binding ============ */
const ORIGIN = "https://sku.goldenspike.app";
const functionsBaseUrl = ORIGIN + "/.netlify/functions";

/* PKCE and tokens live in this origin's localStorage, and Etsy always returns
   to ORIGIN. Opening this page from any other origin therefore cannot complete
   a sign-in — startOAuth bounces to ORIGIN first. */
const ON_ORIGIN = (typeof location !== "undefined") && location.origin === ORIGIN;

/** ============ Token storage ============ */
const TOKEN_KEYS = {
  access : "access_token",
  refresh: "refresh_token",
  exp    : "expires_in",
  iat    : "issued_at"
};

function setTokens(tok){
  if (!tok) return;
  if (tok.access_token)  localStorage.setItem(TOKEN_KEYS.access, tok.access_token);
  if (tok.refresh_token) localStorage.setItem(TOKEN_KEYS.refresh, tok.refresh_token);
  if (tok.expires_in)    localStorage.setItem(TOKEN_KEYS.exp, String(tok.expires_in));
  if (tok.issued_at)     localStorage.setItem(TOKEN_KEYS.iat, String(tok.issued_at));
}
function clearTokens(){
  Object.values(TOKEN_KEYS).forEach(k => { try { localStorage.removeItem(k); } catch (_) {} });
}
function getAccessToken(){ return localStorage.getItem(TOKEN_KEYS.access) || ""; }
function getRefreshToken(){ return localStorage.getItem(TOKEN_KEYS.refresh) || ""; }

function secondsUntilExpiry(){
  const exp = Number(localStorage.getItem(TOKEN_KEYS.exp)||0);
  const iat = Number(localStorage.getItem(TOKEN_KEYS.iat)||0);
  if (!exp || !iat) return 0;
  const now = Math.floor(Date.now()/1000);
  return (iat + exp) - now;
}
function tokenIsFresh(){ return !!getAccessToken() && secondsUntilExpiry() > 60; }

let __refreshTimer = null;
function scheduleTokenRefresh(){
  clearTimeout(__refreshTimer);
  const sec = Math.max(5, secondsUntilExpiry() - 90);
  __refreshTimer = setTimeout(refreshAccessToken, sec*1000);
}

/* One in-flight refresh at a time: a page load can race the scheduled timer
   and a 401 retry, and Etsy rotates the refresh token on every exchange —
   two concurrent refreshes would invalidate each other. */
let __refreshPromise = null;
function refreshAccessToken(){
  if (__refreshPromise) return __refreshPromise;
  __refreshPromise = (async () => {
    const refresh_token = getRefreshToken();
    if (!refresh_token) return false;
    try {
      const r = await fetch(`${functionsBaseUrl}/refreshEtsyToken`, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({ refresh_token })
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok && data.access_token){
        const issued_at = Number(data.issued_at) || Math.floor(Date.now()/1000);
        setTokens({ ...data, issued_at });
        scheduleTokenRefresh();
        setAuthBadge();
        return true;
      }
      console.warn("Refresh failed", data);
      // A rejected refresh token is dead for good — drop it so the UI asks
      // for a fresh sign-in instead of retrying a token Etsy will never accept.
      if (data && data.error === "invalid_grant") clearTokens();
      setAuthBadge();
      return false;
    } catch (e){
      console.warn("Refresh request failed", e);
      return false;
    } finally { __refreshPromise = null; }
  })();
  return __refreshPromise;
}

/** ============ OAuth helpers (match design.html pattern) ============ */
function generateRandomString(length = 64){
  const charset="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  let s=""; const rnd = crypto.getRandomValues(new Uint8Array(length));
  for (let i=0;i<length;i++) s += charset[rnd[i] % charset.length];
  return s;
}
async function generateCodeChallenge(codeVerifier){
  const data = new TextEncoder().encode(codeVerifier);
  const digest = await crypto.subtle.digest("SHA-256", data);
  let b64 = btoa(String.fromCharCode(...new Uint8Array(digest)));
  return b64.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

/* ── PKCE verifier store ─────────────────────────────────────────────────
   Etsy echoes our `state` back on the callback, so the verifier is stored
   UNDER that state instead of in one shared slot.

   This is the fix for `invalid_grant: code_verifier is invalid`. With a single
   slot, any second authorize request — a stale tab, a double click on Connect,
   or a reconnect firing while you were mid-login — overwrote the verifier, and
   the code that eventually came back was then checked against the wrong one.
   Keyed by state, each callback finds the verifier that actually generated its
   challenge. Entries expire after 15 minutes.                              */
const PKCE_KEY   = "etsy_pkce_v2";
const LEGACY_KEY = "etsy_code_verifier";

function stashVerifier(state, verifier){
  let m = {};
  try { m = JSON.parse(localStorage.getItem(PKCE_KEY) || "{}"); } catch (_) {}
  if (!m || typeof m !== "object") m = {};
  const now = Date.now();
  Object.keys(m).forEach(k => { if (now - (m[k] && m[k].at || 0) > 15*60*1000) delete m[k]; });
  m[state] = { v: verifier, at: now };
  try { localStorage.setItem(PKCE_KEY, JSON.stringify(m)); } catch (_) {}
  try { localStorage.setItem(LEGACY_KEY, verifier); } catch (_) {}   // legacy fallback
}

function takeVerifier(state){
  let m = {};
  try { m = JSON.parse(localStorage.getItem(PKCE_KEY) || "{}"); } catch (_) {}
  if (!m || typeof m !== "object") m = {};
  if (state && m[state] && m[state].v) return m[state].v;
  // No state match: fall back to the most recent verifier we issued.
  const newest = Object.values(m).sort((a,b) => (b.at||0) - (a.at||0))[0];
  return (newest && newest.v) || localStorage.getItem(LEGACY_KEY) || "";
}

function dropVerifier(state){
  let m = {};
  try { m = JSON.parse(localStorage.getItem(PKCE_KEY) || "{}"); } catch (_) {}
  if (m && typeof m === "object" && state && m[state]){
    delete m[state];
    try { localStorage.setItem(PKCE_KEY, JSON.stringify(m)); } catch (_) {}
  }
}

let __oauthInFlight = false;
async function startOAuth(reason = "manual"){
  if (__oauthInFlight) return;
  __oauthInFlight = true;
  try {
    // Etsy returns to ORIGIN, so the verifier has to be written there.
    if (!ON_ORIGIN){
      window.location.href = ORIGIN + "/?connect=1";
      return;
    }

    const codeVerifier = generateRandomString(64);
    const state        = `sku_${Date.now()}_${generateRandomString(8)}_${reason}`;
    stashVerifier(state, codeVerifier);
    const codeChallenge = await generateCodeChallenge(codeVerifier);

    // Same CLIENT_ID style as design.html
    const CLIENT_ID  = "k75zdspz4r99txpqdji7i2em";
    const redirectUri = ORIGIN; // Etsy returns to https://sku.goldenspike.app
    const scope      = "listings_w listings_r transactions_r transactions_w";

    const etsyAuthUrl =
      "https://www.etsy.com/oauth/connect?response_type=code" +
      "&client_id=" + CLIENT_ID +
      "&redirect_uri=" + encodeURIComponent(redirectUri) +
      "&scope=" + encodeURIComponent(scope) +
      "&state=" + encodeURIComponent(state) +
      "&code_challenge=" + encodeURIComponent(codeChallenge) +
      "&code_challenge_method=S256";

    window.location.href = etsyAuthUrl;
  } catch (e) {
    console.error("OAuth boot failed:", e);
    __oauthInFlight = false;
    setStatus("Could not start Etsy sign-in", "bad");
  }
}

/** ============ API wrapper ============ */
/* Refreshes a stale token before the call, and once more if Etsy still
   answers 401 — an expired access token used to surface as a bare
   "Error loading listings: 401" with no way out but a full reconnect. */
async function apiFetch(path, init={}){
  if (!tokenIsFresh() && getRefreshToken()) await refreshAccessToken();

  const send = () => {
    const headers = new Headers(init.headers || {});
    const tok = getAccessToken();
    if (tok) headers.set("Access-Token", tok);
    return fetch(`${functionsBaseUrl}${path}`, { ...init, headers });
  };

  let r = await send();
  if (r.status === 401 && getRefreshToken()){
    const ok = await refreshAccessToken();
    if (ok) r = await send();
  }
  return r;
}

/** ============ Selection persistence ============ */
const SELECT_KEY = "sku_selected_ids_v1";
/* IDs are normalized to strings: they arrive as numbers from Etsy and come
   back from JSON unchanged, but a mixed set silently loses checkmarks. */
function loadSelectedSet(){
  try {
    const raw = JSON.parse(localStorage.getItem(SELECT_KEY) || "[]");
    return new Set((Array.isArray(raw) ? raw : []).map(String));
  }
  catch { return new Set(); }
}
function saveSelectedSet(set){
  try { localStorage.setItem(SELECT_KEY, JSON.stringify([...set])); } catch (_) {}
}
let selectedSet = loadSelectedSet();

/** ============ Image zoom helpers ============ */
function attachZoom(wrap, img){
  let scale = 1;
  const MIN = 1, MAX = 5, STEP = 0.2;

  const reset = () => {
    scale = 1;
    img.style.transform = "scale(1)";
    img.style.setProperty("--ox", "50%");
    img.style.setProperty("--oy", "50%");
  };

  // ensure pristine state immediately and whenever the image source finishes loading
  reset();
  img.addEventListener("load", reset, { once: true });

  wrap.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const ox = ((e.clientX - rect.left) / rect.width) * 100;
    const oy = ((e.clientY - rect.top)  / rect.height) * 100;
    img.style.setProperty("--ox", ox + "%");
    img.style.setProperty("--oy", oy + "%");

    const delta = e.deltaY < 0 ? STEP : -STEP;
    scale = Math.min(MAX, Math.max(MIN, +(scale + delta).toFixed(2)));
    img.style.transform = `scale(${scale})`;
  }, { passive: false });

  // quick reset to baseline
  wrap.addEventListener("dblclick", reset);
}

/** ============ Listings UI ============ */
const listContainer = document.getElementById("listContainer");
const pageNumEl     = document.getElementById("pageNum");
const pageSizeEl    = document.getElementById("pageSize");
const searchInput   = document.getElementById("searchInput");
const authStatusEl  = document.getElementById("authStatus");
const prevBtn       = document.getElementById("prevBtn");
const nextBtn       = document.getElementById("nextBtn");
const refreshBtn    = document.getElementById("refreshBtn");
const connectBtn    = document.getElementById("connectEtsyBtn");
const filterCompleteBtn = document.getElementById("filterCompleteBtn");
const pageJumpEl    = document.getElementById("pageJump");
const goBtn         = document.getElementById("goBtn");

let page = 1;
let lastBatch = [];
let filterIncompleteOnly = false; // show ONLY items without the green checkmark
let loading = false;

function setStatus(text, kind){
  if (!authStatusEl) return;
  authStatusEl.textContent = text;
  authStatusEl.className = "status" + (kind ? " " + kind : "");
}

function setAuthBadge(){
  if (getAccessToken()) setStatus(tokenIsFresh() ? "Connected" : "Reconnecting…", tokenIsFresh() ? "ok" : "");
  else if (getRefreshToken()) setStatus("Reconnecting…", "");
  else if (!ON_ORIGIN) setStatus("Open " + ORIGIN + " to sign in", "bad");
  else setStatus("Not connected", "");
}

function showNotice(msg){
  listContainer.innerHTML = "";
  const box = document.createElement("div");
  box.className = "notice";
  box.textContent = msg;
  listContainer.appendChild(box);
}

function titlePassesFilter(t){
  const q = searchInput.value.trim().toLowerCase();
  if (!q) return true;
  return String(t||"").toLowerCase().includes(q);
}

function formatPrice(price){
  if (!price) return "";
  const amount  = Number(price.amount);
  const divisor = Number(price.divisor) || 100;   // Etsy Money objects carry their own divisor
  if (!Number.isFinite(amount)) return "";
  return `${(amount / divisor).toFixed(2)} ${price.currency_code || ""}`.trim();
}

function renderListings(items){
  listContainer.innerHTML = "";
  let shown = 0;
  for (const it of (Array.isArray(items) ? items : [])){
    if (!titlePassesFilter(it.title)) continue;
    // If filtering, hide anything already “checked/complete”
    if (filterIncompleteOnly && selectedSet.has(String(it.listing_id))) continue;
    shown++;

    // ——— image + zoom wrapper ———
    const wrap = document.createElement("div");
    wrap.className = "thumb-wrap";

    const img = document.createElement("img");
    img.className = "thumb";
    img.alt = it.title || "Listing image";
    img.loading = "lazy";
    img.src = it.primary_image || "";
    wrap.appendChild(img);
    attachZoom(wrap, img);

    // ——— meta block ———
    const meta = document.createElement("div");
    meta.className = "meta";

    const title = document.createElement("div");
    title.className = "title";
    title.textContent = it.title || "(untitled)";

    const sku = document.createElement("div");
    sku.className = "sku";
    const firstSku = (Array.isArray(it.skus) && it.skus.length) ? it.skus[0] : "";
    sku.textContent = firstSku ? `SKU: ${firstSku} (Variant 1)` : "SKU: —";

    const row = document.createElement("div");
    row.className = "row";

    // ——— persistent selection checkbox ———
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "selectBox";
    cb.title = "Select listing";
    cb.checked = selectedSet.has(String(it.listing_id));
    cb.addEventListener("change", () => {
      const cardEl = cb.closest(".card");
      if (cb.checked){
        selectedSet.add(String(it.listing_id));
        if (cardEl) cardEl.classList.add("selected");
      } else {
        selectedSet.delete(String(it.listing_id));
        if (cardEl) cardEl.classList.remove("selected");
      }
      saveSelectedSet(selectedSet);
    });
    row.appendChild(cb);

    const idPill = document.createElement("span");
    idPill.className = "pill";
    idPill.textContent = `#${it.listing_id}`;

    const priceText = formatPrice(it.price);
    const pricePill = document.createElement("span");
    pricePill.className = "pill";
    pricePill.textContent = priceText;

    row.appendChild(idPill);
    if (priceText) row.appendChild(pricePill);

    // 🔹 Edit SKUs button
    const editBtn = document.createElement("button");
    editBtn.className = "btn secondary";
    editBtn.textContent = "Edit SKUs";
    editBtn.style.marginLeft = "auto";
    editBtn.addEventListener("click", () => openSkuEditor(it));
    row.appendChild(editBtn);

    // 🔹 Generate button
    const genBtn = document.createElement("button");
    genBtn.className = "btn";
    genBtn.textContent = "Generate";
    genBtn.dataset.role = "gen-btn";
    genBtn.addEventListener("click", () => generateAndSaveSku(it, genBtn));
    row.appendChild(genBtn);

    if (!firstSku) {
      genBtn.style.background = "OrangeRed";
      genBtn.title = "No SKU yet — click Generate";
    }

    meta.appendChild(title);
    meta.appendChild(sku);
    meta.appendChild(row);

    // ——— card assembly ———
    const card = document.createElement("div");
    card.className = "card";
    card.appendChild(wrap);   // ⟵ replaced: was card.appendChild(img)
    card.appendChild(meta);

    // selected highlight on initial render
    if (cb.checked) card.classList.add("selected");

    // 🔹 SKU editor container (hidden until opened)
    const editor = document.createElement("div");
    editor.className = "meta";
    editor.style.display = "none";
    editor.dataset.role = "sku-editor";
    card.appendChild(editor);

    listContainer.appendChild(card);
  }

  if (!shown && Array.isArray(items) && items.length){
    showNotice("No listings on this page match the current filters.");
  }
  return shown;
}

// ───────────────────── SKU Editor helpers ─────────────────────
async function fetchInventoryDetail(listingId){
  const r = await apiFetch(`/etsyListingInventoryDetailProxy?listingId=${encodeURIComponent(listingId)}`);
  if (!r.ok) throw new Error(`Failed to fetch inventory ${listingId} (HTTP ${r.status})`);
  const js = await r.json();
  return Array.isArray(js.products) ? js.products : [];
}

function findCardFor(listingId){
  return [...listContainer.querySelectorAll(".card")]
    .find(c => c.querySelector(".pill")?.textContent === `#${listingId}`);
}

function buildSkuEditorDom(listing, products){
  const card   = findCardFor(listing.listing_id);
  const editor = card?.querySelector('[data-role="sku-editor"]');
  if (!editor) return;
  editor.innerHTML = "";

  const hdr = document.createElement("div");
  hdr.className = "title";
  hdr.textContent = "Edit SKU (Variant 1)";
  editor.appendChild(hdr);

  // Use only the first product (Variant 1)
  const p = (Array.isArray(products) && products.length) ? products[0] : { product_id: null, sku: "" };

  const row = document.createElement("div");
  row.className = "row";
  row.style.gap = "6px";
  row.style.alignItems = "center";

  const tag = document.createElement("span");
  tag.className = "pill";
  tag.textContent = "Variant 1";
  row.appendChild(tag);

  const input = document.createElement("input");
  input.type  = "text";
  input.value = p.sku || "";
  input.placeholder = "SKU";
  input.style.flex = "1";
  input.dataset.productId = p.product_id != null ? String(p.product_id) : "";
  input.className = "skuInput";
  input.maxLength = 64;
  row.appendChild(input);

  editor.appendChild(row);

  const actions = document.createElement("div");
  actions.className = "row";

  const cancel = document.createElement("button");
  cancel.className = "btn secondary";
  cancel.textContent = "Cancel";
  cancel.addEventListener("click", () => editor.style.display = "none");

  const save = document.createElement("button");
  save.className = "btn";
  save.textContent = "Save";
  save.addEventListener("click", async () => {
    const el = editor.querySelector(".skuInput");
    const productId = Number(el.dataset.productId);
    if (!Number.isFinite(productId) || !productId){
      alert("This listing has no Variant 1 product to write to.");
      return;
    }
    const item = { product_id: productId, sku: el.value.trim() };
    save.disabled = true;
    try {
      const ok = await saveSkuUpdates(listing.listing_id, [item]); // only Variant 1
      if (ok){
        // Update visible SKU line on card
        listing.skus = [item.sku].filter(Boolean);
        const skuLine = card.querySelector(".sku");
        const firstSku = (Array.isArray(listing.skus) && listing.skus.length) ? listing.skus[0] : "";
        if (skuLine) skuLine.textContent = firstSku ? `SKU: ${firstSku} (Variant 1)` : "SKU: —";
        // Reset Generate button color if SKU now exists
        const genBtn = card.querySelector('[data-role="gen-btn"]');
        if (genBtn) genBtn.style.background = firstSku ? "" : "OrangeRed";
        editor.style.display = "none";
      }
    } catch (e){
      alert("Failed to update SKUs: " + e.message);
    } finally {
      save.disabled = false;
    }
  });

  actions.appendChild(cancel);
  actions.appendChild(save);
  editor.appendChild(actions);
}

async function openSkuEditor(listing){
  try {
    const products = await fetchInventoryDetail(listing.listing_id);
    buildSkuEditorDom(listing, products);
    const card = findCardFor(listing.listing_id);
    const editor = card?.querySelector('[data-role="sku-editor"]');
    if (editor) editor.style.display = "block";
  } catch (e){
    alert("Could not open SKU editor: " + e.message);
  }
}

async function saveSkuUpdates(listingId, items){
  const r = await apiFetch(`/etsyUpdateListingInventoryProxy`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ listing_id: Number(listingId), items })
  });
  if (!r.ok){
    const t = await r.text();
    throw new Error(`HTTP ${r.status}: ${t}`);
  }
  const js = await r.json();
  return !!js.ok;
}

async function fetchListingDescription(listingId){
  const r = await apiFetch(`/etsyListingGetProxy?listingId=${encodeURIComponent(listingId)}`);
  if (!r.ok) return "";
  const js = await r.json();
  // Etsy may return description as a long string; guard just in case
  return typeof js.description === "string" ? js.description : "";
}

function makeSkuFrom(title, listingId){
  const last4 = String(listingId).slice(-4);
  const firstWordMatch = String(title || "").match(/[A-Za-z0-9]+/);
  const raw = firstWordMatch ? firstWordMatch[0] : "SKU";
  const pretty = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
  return `${pretty}_${last4}`;
}

/* Pick the listing's primary image out of an Etsy images array. */
function pickPrimaryImage(images){
  if (!Array.isArray(images) || !images.length) return "";
  const best = images.find(x => x && x.is_primary) ||
               [...images].sort((a,b) => (a?.rank ?? 999) - (b?.rank ?? 999))[0] ||
               images[0];
  return best?.url_fullxfull || best?.url_570xN || "";
}

/* Pull Variant 1's SKU out of an inlined inventory document. */
function skusFromInventory(inventory){
  const products = inventory && Array.isArray(inventory.products) ? inventory.products : [];
  const out = [];
  for (const p of products){
    const sku = String(p?.sku || "").trim();
    if (sku) out.push(sku);
  }
  return out;
}

async function fetchPrimaryImage(listingId){
  const r = await apiFetch(`/etsyListingImagesProxy?listingId=${encodeURIComponent(listingId)}`);
  if (!r.ok) return "";
  const js = await r.json();
  return pickPrimaryImage(js.results);
}

async function fetchSkus(listingId){
  const r = await apiFetch(`/etsyListingInventoryProxy?listingId=${encodeURIComponent(listingId)}`);
  if (!r.ok) return [];
  const js = await r.json();
  return js.skus || [];
}

/* Bounded-concurrency worker. A failing item resolves to null rather than
   rejecting: one dead listing must not abort the whole page, and an
   unobserved rejection from a sibling promise used to surface as an
   uncaught error. */
async function pLimit(iterable, concurrency=6, worker){
  const queue = [...iterable];
  const running = new Set();
  const done = [];
  const start = (item) => {
    const p = Promise.resolve()
      .then(() => worker(item))
      .catch(err => { console.warn("Listing enrichment failed", err); return null; })
      .finally(() => running.delete(p));
    running.add(p);
    return p;
  };
  while (queue.length || running.size){
    while (queue.length && running.size < concurrency) start(queue.shift());
    if (running.size) done.push(await Promise.race(running));
  }
  return done;
}

async function loadPage(p=1){
  if (loading) return;
  const limit = Math.min(100, Math.max(1, Number(pageSizeEl.value||100)));
  const offset = (p-1) * limit;

  if (!getAccessToken() && !getRefreshToken()){
    showNotice("Please connect Etsy first.");
    return;
  }

  loading = true;
  refreshBtn.disabled = true;
  try {
    showNotice("Loading listings…");

    // One call returns titles, prices, images AND inventory. Per-listing image
    // and inventory reads below are a fallback only — at 100 listings a page
    // they cost 200 extra Etsy calls and used to run every single refresh.
    const r = await apiFetch(
      `/etsyShopListingsProxy?limit=${limit}&offset=${offset}&state=active&includes=Images,Inventory`
    );
    if (!r.ok){
      const t = await r.text();
      listContainer.innerHTML = "";
      const card = document.createElement("div");
      card.className = "card";
      const meta = document.createElement("div");
      meta.className = "meta";
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = `Error loading listings: ${r.status}`;
      const detail = document.createElement("div");
      detail.className = "sku";
      detail.textContent = t;
      meta.appendChild(title); meta.appendChild(detail);
      card.appendChild(meta);
      listContainer.appendChild(card);
      return;
    }
    const js = await r.json();
    const raw = Array.isArray(js.results) ? js.results : (Array.isArray(js) ? js : []);

    const base = raw.map(x => ({
      listing_id: x.listing_id,
      title     : x.title,
      price     : x.price,
      primary_image: pickPrimaryImage(x.images),
      skus: skusFromInventory(x.inventory).slice(0, 1) // Variant 1 only
    }));

    // Fill only what the bulk call could not supply.
    const needsDetail = base.filter(item => !item.primary_image || !item.skus.length);
    if (needsDetail.length){
      await pLimit(needsDetail, 6, async (item) => {
        const [img, skus] = await Promise.all([
          item.primary_image ? item.primary_image : fetchPrimaryImage(item.listing_id),
          item.skus.length   ? item.skus          : fetchSkus(item.listing_id)
        ]);
        item.primary_image = img || "";
        item.skus = (skus || []).slice(0, 1);
        return item;
      });
    }

    lastBatch = base;
    if (!base.length) showNotice("No listings found on this page.");
    else renderListings(lastBatch);

    page = p;
    pageNumEl.textContent = String(p);
    prevBtn.disabled = p <= 1;
    nextBtn.disabled = raw.length < limit;
  } catch (e){
    console.error("loadPage failed", e);
    showNotice("Could not load listings: " + e.message);
  } finally {
    loading = false;
    refreshBtn.disabled = false;
    setAuthBadge();
  }
}

async function generateAndSaveSku(listing, btn){
  try {
    btn.disabled = true;
    // 1) Build SKU from TITLE ONLY
    const computedSku = makeSkuFrom(listing.title || "", listing.listing_id);

    // 2) Get Variant 1 product_id
    const products = await fetchInventoryDetail(listing.listing_id);
    const p0 = (Array.isArray(products) && products.length) ? products[0] : null;
    if (!p0 || p0.product_id == null) throw new Error("Missing Variant 1");

    // 3) Save (server enforces consistency across all variants)
    const ok = await saveSkuUpdates(listing.listing_id, [{ product_id: Number(p0.product_id), sku: computedSku }]);
    if (ok){
      listing.skus = [computedSku];
      const card = findCardFor(listing.listing_id);
      const skuLine = card?.querySelector(".sku");
      if (skuLine) skuLine.textContent = `SKU: ${computedSku} (Variant 1)`;
      // Remove warning color now that SKU exists
      if (btn) btn.style.background = "";
    }
  } catch (e){
    alert("Generate failed: " + e.message);
  } finally {
    btn.disabled = false;
  }
}

/** ============ Boot ============ */
/* Returns what the OAuth return handler did, so the boot path (and tests)
   can tell a completed sign-in from a failed one. */
function bootOAuth(){
  const url = new URLSearchParams(location.search);

  // 1) Server redirect already carrying tokens → store and clean the URL.
  const access_token  = url.get("access_token");
  const refresh_token = url.get("refresh_token");
  const expires_in    = url.get("expires_in");
  const issued_at     = url.get("issued_at");
  if (access_token && refresh_token && expires_in && issued_at){
    setTokens({ access_token, refresh_token, expires_in, issued_at });
    history.replaceState({}, "", ORIGIN + location.pathname); // clean query
    setStatus("Connected", "ok");
    return "tokens";
  }

  // 2) Etsy declined or errored.
  const err = url.get("error");
  if (err){
    history.replaceState({}, "", ORIGIN + location.pathname);
    setStatus("Etsy sign-in failed", "bad");
    console.error("Etsy OAuth error:", err, url.get("error_description") || "");
    return "error";
  }

  // 3) Standard OAuth code return → hand the code to the server for exchange.
  const code = url.get("code");
  if (code){
    const state = url.get("state") || "";
    const v = takeVerifier(state);

    // An authorization code is single-use. A reload or a back-navigation on
    // this URL replays it and Etsy rejects the second attempt.
    let lastCode = null;
    try { lastCode = sessionStorage.getItem("etsy_last_code"); } catch (_) {}
    if (lastCode === code){
      history.replaceState({}, "", ORIGIN + location.pathname);
      setStatus("Sign-in link already used", "bad");
      return "replay";
    }

    if (v){
      try { sessionStorage.setItem("etsy_last_code", code); } catch (_) {}
      dropVerifier(state);
      const qs = new URLSearchParams({ code, code_verifier: v, redirect_domain: "sku" });
      window.location.href = ORIGIN + "/.netlify/functions/exchangeToken?" + qs.toString();
      return "exchange";
    }

    console.error("OAuth callback arrived with no stored code_verifier.", { state });
    history.replaceState({}, "", ORIGIN + location.pathname);
    setStatus("Sign-in did not complete — press Connect Etsy", "bad");
    return "no-verifier";
  }

  // 4) Nothing OAuth-shaped in the URL.
  if (url.get("connect") === "1"){
    history.replaceState({}, "", ORIGIN + location.pathname);
    return "connect";
  }
  return "none";
}

document.addEventListener("DOMContentLoaded", async () => {
  const outcome = bootOAuth();
  if (outcome === "exchange") return;   // navigating away to the token exchange

  document.getElementById("connectEtsyBtn").addEventListener("click", () => startOAuth("button"));
  document.getElementById("refreshBtn").addEventListener("click", () => loadPage(page));
  document.getElementById("prevBtn").addEventListener("click", () => { if (page>1) return loadPage(page-1); });
  document.getElementById("nextBtn").addEventListener("click", () => loadPage(page+1));
  document.getElementById("pageSize").addEventListener("change", () => loadPage(1));
  document.getElementById("searchInput").addEventListener("input", () => renderListings(lastBatch));

  // Toggle: show only items WITHOUT green checkmark (unchecked)
  filterCompleteBtn.addEventListener("click", () => {
    filterIncompleteOnly = !filterIncompleteOnly;
    filterCompleteBtn.classList.toggle("active", filterIncompleteOnly);
    renderListings(lastBatch);
  });
  // Jump to page (button + Enter key)
  const jump = () => loadPage(Math.max(1, Number(pageJumpEl.value || 1)));
  goBtn.addEventListener("click", jump);
  pageJumpEl.addEventListener("keydown", (e) => { if (e.key === "Enter") return jump(); });

  if (outcome === "connect"){ await startOAuth("cross-origin"); return; }

  // Token lifecycle: an expired access token is refreshed before the first
  // read instead of surfacing as a 401 wall.
  if (getAccessToken() && tokenIsFresh()) scheduleTokenRefresh();
  else if (getRefreshToken()) await refreshAccessToken();

  setAuthBadge();

  if (getAccessToken()) await loadPage(1);
  else showNotice("Please connect Etsy first.");
});
</script>
