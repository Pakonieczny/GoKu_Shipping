  <meta name="theme-color" content="#221f1b">
  <style>
    :root{
      --bg:#0a0a0a; --panel:#111; --card:#121212; --line:#222; --line2:#2a2a2a;
      --text:#eee; --dim:#bbb; --dim2:#8f8f8f; --accent:#2962ff; --good:#2e7d32; --warn:#e65100;
      --hdr: 108px;                      /* sticky header height, kept in sync below */
    }
    *{ box-sizing:border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin:0; background:var(--bg); color:var(--text); }

    /* ── Sticky command bar ───────────────────────────────────────────────
       Two fixed rows. Search sits on row 1 at full width because it is the
       highest-frequency control; section chips sit on row 2 where they can be
       hit without leaving the pointer's path to the grid. Nothing below the
       header ever reflows the header, so the search box never moves under the
       cursor mid-typing. */
    header { position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line); }
    .bar { display:flex; gap:8px; align-items:center; padding:8px 12px; }
    .bar2 { padding-top:0; flex-wrap:wrap; }

    .btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 13px; cursor:pointer; font-weight:600; font-size:13px; white-space:nowrap; }
    .btn:disabled { opacity:.5; cursor:default; }
    .btn.secondary { background:#333; }
    .btn.ghost { background:transparent; border:1px solid var(--line2); color:var(--dim); }

    .search { flex:1; position:relative; min-width:200px; }
    .search input {
      width:100%; background:#181818; color:var(--text); border:1px solid var(--line2);
      border-radius:10px; padding:11px 84px 11px 38px; font-size:15px;
    }
    .search input:focus { outline:none; border-color:var(--accent); }
    .search .mag { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--dim2); font-size:14px; pointer-events:none; }
    .search .hint { position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--dim2); font-size:11px; pointer-events:none; }
    .search .clear { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:#2a2a2a; border:0; color:var(--dim); border-radius:6px; padding:3px 7px; cursor:pointer; font-size:12px; display:none; }

    /* ── Section / filter chips ───────────────────────────────────────────
       This row is the console's primary navigation, so the targets are sized
       for repeated use, not for decoration: 40px tall clears the ~44px touch
       guidance at a comfortable density, and the selected chip is filled
       rather than merely outlined so the active section is readable at a
       glance from across a desk. The row scrolls sideways rather than
       wrapping, which keeps the header a fixed height and stops the grid
       jumping when a filter changes. */
    .chiprow {
      display:flex; gap:8px; align-items:center; padding:0 12px 10px;
      overflow-x:auto; overflow-y:hidden; scrollbar-width:thin;
    }
    .chiprow::-webkit-scrollbar { height:6px; }
    .chiprow::-webkit-scrollbar-thumb { background:#2e2e2e; border-radius:3px; }

    .chip {
      background:#1b1b1b; border:1px solid #333; color:#d6d6d6;
      border-radius:999px; padding:0 16px; height:40px; cursor:pointer;
      font-size:14px; font-weight:600; letter-spacing:.2px;
      display:inline-flex; align-items:center; gap:8px; white-space:nowrap; flex:0 0 auto;
      transition: background .12s, border-color .12s, color .12s;
    }
    .chip .n {
      color:#9a9a9a; font-variant-numeric:tabular-nums; font-size:12.5px; font-weight:600;
      background:#242424; border-radius:999px; padding:2px 8px; min-width:30px; text-align:center;
    }
    .chip:hover { background:#232323; border-color:#454545; color:#fff; }
    .chip:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

    .chip.on { background:#00695c; border-color:#26a69a; color:#fff; }
    .chip.on .n { background:#00897b; color:#e0f2f1; }
    .chip.flag.on { background:#bf4a00; border-color:#ff8f3f; color:#fff; }
    .chip.flag.on .n { background:#e2681a; color:#fff3e6; }

    /* Separates the shop's own sections from the two state filters. */
    .chipsep { flex:0 0 auto; width:1px; height:26px; background:#333; margin:0 4px; }

    .status { font-size:12px; color:#9ad; white-space:nowrap; }
    .status.bad { color:#ff8a80; }
    .status.ok  { color:#7ddf8a; }

    /* Live counters: catalog size, result count, API spend. Tabular figures so
       the numbers do not jitter as they tick during a sync. */
    .meter { font-size:11.5px; color:var(--dim2); white-space:nowrap; font-variant-numeric:tabular-nums; }
    .meter b { color:var(--dim); font-weight:600; }
    .meter.warn b { color:#ffb74d; }
    .meter.bad b { color:#ff8a80; }

    /* Sync progress: a hairline under the header, so a background refresh
       never pushes the grid down. */
    .syncbar { height:2px; background:transparent; }
    .syncbar > i { display:block; height:100%; width:0%; background:var(--accent); transition:width .2s linear; }

    /* ── Results grid ─────────────────────────────────────────────────────── */
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap:12px; padding:12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; content-visibility:auto; contain-intrinsic-size: 420px; }

    /* ── Image box: click-to-zoom, drag-to-pan, rule-of-thirds grid ───────
       Ported from the batch-review console's .rv-box, which in turn came from
       Listing_Generator_1's .slotPrev. The box model is load-bearing: the pan
       clamp in attachPreviewBoxListeners assumes object-fit:contain, no
       absolute centring, and transform-origin at the centre. The .3s
       transition is what makes click-to-zoom glide rather than snap.

       touch-action is deliberately NOT set to none here, unlike the source.
       The source needed it because it handled pinch; this console does not,
       and pinning it would stop a finger scrolling the page over an image —
       the same complaint that removed the wheel handler. */
    .thumb-wrap{
      position:relative; width:100%; aspect-ratio:1/1; overflow:hidden;
      background:#151515; cursor:grab;
    }
    .thumb{
      width:100%; height:100%; object-fit:contain; display:block;
      transform-origin:center center; transition:transform .3s ease; cursor:grab;
      user-select:none; -webkit-user-drag:none;
    }
    .thumb:active{ cursor:grabbing; }

    /* Rule-of-thirds overlay — the exact pattern from the source's
       .rv-box::after. Permanent: four 1px hairlines at 18% white on the
       thirds, above the image, click-through. */
    .thumb-wrap::after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:700;
      background-image:
        linear-gradient(to right, rgba(255,255,255,.18), rgba(255,255,255,.18)),
        linear-gradient(to right, rgba(255,255,255,.18), rgba(255,255,255,.18)),
        linear-gradient(to bottom, rgba(255,255,255,.18), rgba(255,255,255,.18)),
        linear-gradient(to bottom, rgba(255,255,255,.18), rgba(255,255,255,.18));
      background-size: 1px 100%, 1px 100%, 100% 1px, 100% 1px;
      background-position: 33.333% 0, 66.666% 0, 0 33.333%, 0 66.666%;
      background-repeat: no-repeat;
    }


    .meta { padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; }
    /* One line only: the full title is in the tooltip and in the search index,
       so the card shows just enough to identify the piece. */
    .title {
      font-size:13.5px; line-height:1.3; color:#fafafa; font-weight:600;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }

    /* ── The SKU line ─────────────────────────────────────────────────────
       The one value this console exists to read and set, so it is the biggest
       thing on the card after the picture. Clicking it edits in place; there is
       no separate edit button. */
    .skuline { display:flex; align-items:center; gap:8px; min-height:34px; }
    .skulabel { font-size:15px; font-weight:500; color:#8f8f8f; letter-spacing:.02em; flex:0 0 auto; }
    .skuvalue {
      font-size:17px; font-weight:500; color:#fafafa; letter-spacing:.01em;
      background:transparent; border:1px dashed transparent; border-radius:7px;
      padding:3px 7px; margin-left:-7px; cursor:text; text-align:left;
      font-family:inherit; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .skuvalue:hover { border-color:#3d3d3d; background:#171717; }
    .skuvalue.none { color:#ff9e80; font-weight:700; }
    .skuinput {
      flex:1 1 auto; min-width:0; background:#181818; color:#fafafa;
      border:1px solid var(--accent); border-radius:7px; padding:5px 8px;
      font-size:16px; font-weight:500; font-family:inherit; letter-spacing:.01em;
    }
    .skuinput:focus { outline:none; }

    /* Save / cancel sit inside the SKU line so the whole interaction is one row. */
    .iconbtn {
      flex:0 0 auto; border:0; border-radius:7px; cursor:pointer;
      width:32px; height:30px; font-size:14px; font-weight:800; line-height:1;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .iconbtn.save { background:var(--good); color:#fff; }
    .iconbtn.copy { background:#2a2a2a; color:#bdbdbd; }
    .iconbtn.copy:hover { background:#383838; color:#fff; }
    .iconbtn.copy.done { background:var(--good); color:#fff; }
    .iconbtn.cancel { background:#333; color:#ccc; }
    .iconbtn:disabled { opacity:.55; cursor:default; }

    /* Unsaved-generated marker: an amber dot and one word. A generated SKU is
       only a proposal until it is saved, and refreshing loses it. */
    .unsaved {
      flex:0 0 auto; display:inline-flex; align-items:center; gap:5px;
      font-size:11px; font-weight:800; color:#ffb74d; letter-spacing:.04em; text-transform:uppercase;
    }
    .unsaved::before {
      content:""; width:7px; height:7px; border-radius:50%; background:#ffb74d;
      box-shadow:0 0 0 3px rgba(255,183,77,.16);
    }
    .card.pending { outline:2px solid #ffb74d; outline-offset:-1px; }

    /* One row: state, identity, section, action. Nothing wraps to a second
       line at the card widths this grid produces. */
    .row { display:flex; gap:7px; align-items:center; flex-wrap:wrap; }
    .row .grow { margin-left:auto; }
    .pill { font-size:11.5px; padding:3px 8px; border-radius:999px; border:1px solid var(--line2); color:#cfcfcf; white-space:nowrap; }
    .pill.sect { border-color:#2b3a52; color:#9fc0ea; max-width:42%; overflow:hidden; text-overflow:ellipsis; }
    .btn.tiny { padding:6px 11px; font-size:12px; border-radius:7px; }
    mark { background:#4a3d00; color:#ffe89a; border-radius:2px; padding:0 1px; }

    /* Spinner for the moment a write is in flight. */
    .spin {
      display:inline-block; width:13px; height:13px; border-radius:50%;
      border:2px solid rgba(255,255,255,.35); border-top-color:#fff;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    input[type="text"]{ background:#181818; color:#ddd; border:1px solid var(--line2); border-radius:8px; padding:8px; }

    .notice { margin:14px 12px; padding:14px 16px; border:1px solid var(--line2); border-radius:12px; background:#141414; color:var(--dim); font-size:13px; line-height:1.5; }
    .notice b { color:var(--text); }
    .sentinel { height:1px; }
    .endcap { padding:18px 12px 40px; text-align:center; color:var(--dim2); font-size:12px; }
  </style>
</head>
<body>

  <header>
    <div class="bar">
      <div class="search">
        <span class="mag">⌕</span>
        <input id="searchInput" type="text" autocomplete="off" spellcheck="false"
               placeholder="Search every listing — title, SKU or ID.  Try sku: to match SKUs only" />
        <span class="hint" id="searchHint">/</span>
        <button class="clear" id="searchClear" title="Clear (Esc)">✕</button>
      </div>
      <span class="meter" id="resultMeter"></span>
      <span class="meter" id="catalogMeter"></span>
      <span class="meter" id="apiMeter" title="Etsy API calls — this console today, and the key's remaining daily quota"></span>
      <button id="syncBtn" class="btn secondary" title="Fetch listings changed since the last sync · Shift-click to rebuild the whole catalog">Sync</button>
      <button id="connectEtsyBtn" class="btn">Connect Etsy</button>
      <span id="authStatus" class="status">Not connected</span>
      <span class="meter" id="buildStamp" title="Console build — quote this if something misbehaves"></span>
    </div>
    <div class="chiprow" id="chipRow"></div>
    <div class="syncbar"><i id="syncProgress"></i></div>
  </header>

  <main id="listContainer" class="grid" aria-live="polite"></main>
  <div id="sentinel" class="sentinel"></div>
  <div id="endcap" class="endcap"></div>

<script>
/** ============ Hard domain binding ============ */
/* Bumped whenever this console changes in a way that matters operationally.
   Shown in the header and quoted in any sync failure, so a stale tab running
   against newer functions is identifiable from a screenshot instead of
   guessed at. */
const BUILD = "2026-09-16h";

/* The section shortcuts, exactly as specified — not every section the shop
   has. Etsy returns dozens (Zodiac / Birth Flower, Handwriting Jewelry, Evil
   Eye Jewelry and so on); rendering them all buried the five that matter and
   pushed the row off the screen. Listings in other sections are still in the
   catalog, still searchable, and still reachable under "All" — they just do not
   get a chip. Edit this list to change the shortcuts; order here is the order
   on screen, and matching is case-insensitive against Etsy's section titles. */
const SECTION_CHIPS = ["NECKLACES", "EARRINGS", "CHARMS", "BRACELETS", "RINGS"];
const ORIGIN = "https://sku.goldenspike.app";
const functionsBaseUrl = ORIGIN + "/.netlify/functions";

/* PKCE and tokens live in this origin's localStorage, and Etsy always returns
   to ORIGIN. Opening this page from any other origin therefore cannot complete
   a sign-in — startOAuth bounces to ORIGIN first. */
const ON_ORIGIN = (typeof location !== "undefined") && location.origin === ORIGIN;

/** ============ Token storage ============ */
const TOKEN_KEYS = {
  access : "access_token",
  refresh: "refresh_token",
  exp    : "expires_in",
  iat    : "issued_at"
};

function setTokens(tok){
  if (!tok) return;
  if (tok.access_token)  localStorage.setItem(TOKEN_KEYS.access, tok.access_token);
  if (tok.refresh_token) localStorage.setItem(TOKEN_KEYS.refresh, tok.refresh_token);
  if (tok.expires_in)    localStorage.setItem(TOKEN_KEYS.exp, String(tok.expires_in));
  if (tok.issued_at)     localStorage.setItem(TOKEN_KEYS.iat, String(tok.issued_at));
}
function clearTokens(){
  Object.values(TOKEN_KEYS).forEach(k => { try { localStorage.removeItem(k); } catch (_) {} });
}
function getAccessToken(){ return localStorage.getItem(TOKEN_KEYS.access) || ""; }
function getRefreshToken(){ return localStorage.getItem(TOKEN_KEYS.refresh) || ""; }

function secondsUntilExpiry(){
  const exp = Number(localStorage.getItem(TOKEN_KEYS.exp)||0);
  const iat = Number(localStorage.getItem(TOKEN_KEYS.iat)||0);
  if (!exp || !iat) return 0;
  const now = Math.floor(Date.now()/1000);
  return (iat + exp) - now;
}
function tokenIsFresh(){ return !!getAccessToken() && secondsUntilExpiry() > 60; }

let __refreshTimer = null;
function scheduleTokenRefresh(){
  clearTimeout(__refreshTimer);
  const sec = Math.max(5, secondsUntilExpiry() - 90);
  __refreshTimer = setTimeout(refreshAccessToken, sec*1000);
}

/* One in-flight refresh at a time: a page load can race the scheduled timer
   and a 401 retry, and Etsy rotates the refresh token on every exchange —
   two concurrent refreshes would invalidate each other. */
let __refreshPromise = null;
function refreshAccessToken(){
  if (__refreshPromise) return __refreshPromise;
  __refreshPromise = (async () => {
    const refresh_token = getRefreshToken();
    if (!refresh_token) return false;
    try {
      const r = await fetch(`${functionsBaseUrl}/refreshEtsyToken`, {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({ refresh_token })
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok && data.access_token){
        const issued_at = Number(data.issued_at) || Math.floor(Date.now()/1000);
        setTokens({ ...data, issued_at });
        scheduleTokenRefresh();
        setAuthBadge();
        return true;
      }
      console.warn("Refresh failed", data);
      // A rejected refresh token is dead for good — drop it so the UI asks
      // for a fresh sign-in instead of retrying a token Etsy will never accept.
      if (data && data.error === "invalid_grant") clearTokens();
      setAuthBadge();
      return false;
    } catch (e){
      console.warn("Refresh request failed", e);
      return false;
    } finally { __refreshPromise = null; }
  })();
  return __refreshPromise;
}

/** ============ OAuth helpers (match design.html pattern) ============ */
function generateRandomString(length = 64){
  const charset="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";
  let s=""; const rnd = crypto.getRandomValues(new Uint8Array(length));
  for (let i=0;i<length;i++) s += charset[rnd[i] % charset.length];
  return s;
}
async function generateCodeChallenge(codeVerifier){
  const data = new TextEncoder().encode(codeVerifier);
  const digest = await crypto.subtle.digest("SHA-256", data);
  let b64 = btoa(String.fromCharCode(...new Uint8Array(digest)));
  return b64.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

/* ── PKCE verifier store ─────────────────────────────────────────────────
   Etsy echoes our `state` back on the callback, so the verifier is stored
   UNDER that state instead of in one shared slot.

   This is the fix for `invalid_grant: code_verifier is invalid`. With a single
   slot, any second authorize request — a stale tab, a double click on Connect,
   or a reconnect firing while you were mid-login — overwrote the verifier, and
   the code that eventually came back was then checked against the wrong one.
   Keyed by state, each callback finds the verifier that actually generated its
   challenge. Entries expire after 15 minutes.                              */
const PKCE_KEY   = "etsy_pkce_v2";
const LEGACY_KEY = "etsy_code_verifier";

function stashVerifier(state, verifier){
  let m = {};
  try { m = JSON.parse(localStorage.getItem(PKCE_KEY) || "{}"); } catch (_) {}
  if (!m || typeof m !== "object") m = {};
  const now = Date.now();
  Object.keys(m).forEach(k => { if (now - (m[k] && m[k].at || 0) > 15*60*1000) delete m[k]; });
  m[state] = { v: verifier, at: now };
  try { localStorage.setItem(PKCE_KEY, JSON.stringify(m)); } catch (_) {}
  try { localStorage.setItem(LEGACY_KEY, verifier); } catch (_) {}   // legacy fallback
}

function takeVerifier(state){
  let m = {};
  try { m = JSON.parse(localStorage.getItem(PKCE_KEY) || "{}"); } catch (_) {}
  if (!m || typeof m !== "object") m = {};
  if (state && m[state] && m[state].v) return m[state].v;
  // No state match: fall back to the most recent verifier we issued.
  const newest = Object.values(m).sort((a,b) => (b.at||0) - (a.at||0))[0];
  return (newest && newest.v) || localStorage.getItem(LEGACY_KEY) || "";
}

function dropVerifier(state){
  let m = {};
  try { m = JSON.parse(localStorage.getItem(PKCE_KEY) || "{}"); } catch (_) {}
  if (m && typeof m === "object" && state && m[state]){
    delete m[state];
    try { localStorage.setItem(PKCE_KEY, JSON.stringify(m)); } catch (_) {}
  }
}

let __oauthInFlight = false;
async function startOAuth(reason = "manual"){
  if (__oauthInFlight) return;
  __oauthInFlight = true;
  try {
    // Etsy returns to ORIGIN, so the verifier has to be written there.
    if (!ON_ORIGIN){
      window.location.href = ORIGIN + "/?connect=1";
      return;
    }

    const codeVerifier = generateRandomString(64);
    const state        = `sku_${Date.now()}_${generateRandomString(8)}_${reason}`;
    stashVerifier(state, codeVerifier);
    const codeChallenge = await generateCodeChallenge(codeVerifier);

    // Same CLIENT_ID style as design.html
    const CLIENT_ID  = "k75zdspz4r99txpqdji7i2em";
    const redirectUri = ORIGIN; // Etsy returns to https://sku.goldenspike.app
    const scope      = "listings_w listings_r transactions_r transactions_w";

    const etsyAuthUrl =
      "https://www.etsy.com/oauth/connect?response_type=code" +
      "&client_id=" + CLIENT_ID +
      "&redirect_uri=" + encodeURIComponent(redirectUri) +
      "&scope=" + encodeURIComponent(scope) +
      "&state=" + encodeURIComponent(state) +
      "&code_challenge=" + encodeURIComponent(codeChallenge) +
      "&code_challenge_method=S256";

    window.location.href = etsyAuthUrl;
  } catch (e) {
    console.error("OAuth boot failed:", e);
    __oauthInFlight = false;
    setStatus("Could not start Etsy sign-in", "bad");
  }
}

/** ============ API wrapper ============ */
/* Refreshes a stale token before the call, and once more if Etsy still
   answers 401 — an expired access token used to surface as a bare
   "Error loading listings: 401" with no way out but a full reconnect. */
async function apiFetch(path, init={}){
  if (!tokenIsFresh() && getRefreshToken()) await refreshAccessToken();

  const send = () => {
    const headers = new Headers(init.headers || {});
    const tok = getAccessToken();
    if (tok) headers.set("Access-Token", tok);
    return fetch(`${functionsBaseUrl}${path}`, { ...init, headers });
  };

  let r = await send();
  if (r.status === 401 && getRefreshToken()){
    const ok = await refreshAccessToken();
    if (ok) r = await send();
  }
  return r;
}


/** ============ Local catalog store ==========================================
 *
 * WHY A LOCAL CATALOG
 * The shop holds ~5,600 active listings and the Etsy key allows ~3,500 calls a
 * day, most of it already spent by production. Searching the shop by calling
 * Etsy per keystroke — or even per search — is not affordable: Etsy's own
 * title search costs one call per 100 candidates scanned, so a single broad
 * query can burn dozens of calls and still only look at part of the shop.
 *
 * Instead the console keeps a local mirror of the catalog. Building it costs
 * one page of 100 listings per call — about 57 calls for the whole shop, a
 * one-off ~1.6% of the daily budget — and every search after that is a local
 * scan costing ZERO calls and completing in single-digit milliseconds. The
 * bulk read asks for Images and Inventory inline, so one call per page brings
 * back titles, thumbnails, prices, SKUs and section ids together.
 *
 * Keeping it current costs 1-2 calls: listings are re-read newest-modified
 * first and the walk stops at the first page that is entirely older than the
 * last sync.
 *
 * STORAGE lives in IndexedDB — a few MB of records is far past what
 * localStorage holds. If IndexedDB is unavailable (private windows, blocked
 * site data) the same interface falls back to memory: the console still works
 * for the session, it just rebuilds the catalog next time.
 */
const DB_NAME = "sku_catalog_v1";
const STORE_LISTINGS = "listings";
const STORE_META = "meta";

function memoryStore(reason){
  const rows = new Map();
  const meta = new Map();
  return {
    kind: "memory", reason,
    async getAll(){ return [...rows.values()]; },
    async putMany(list){ for (const r of list) rows.set(String(r.listing_id), r); },
    async deleteMany(ids){ for (const id of ids) rows.delete(String(id)); },
    async clear(){ rows.clear(); },
    async getMeta(k){ return meta.has(k) ? meta.get(k) : null; },
    async setMeta(k, v){ meta.set(k, v); }
  };
}

function openCatalogStore(){
  return new Promise(resolve => {
    let idb = null;
    try { idb = typeof indexedDB !== "undefined" ? indexedDB : null; } catch (_) {}
    if (!idb) return resolve(memoryStore("IndexedDB is unavailable in this browser context"));

    let req;
    try { req = idb.open(DB_NAME, 1); }
    catch (e) { return resolve(memoryStore("IndexedDB could not be opened: " + e.message)); }

    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_LISTINGS)) db.createObjectStore(STORE_LISTINGS, { keyPath: "listing_id" });
      if (!db.objectStoreNames.contains(STORE_META)) db.createObjectStore(STORE_META);
    };
    req.onerror = () => resolve(memoryStore("IndexedDB was blocked: " + (req.error && req.error.message || "unknown")));
    req.onsuccess = () => {
      const db = req.result;
      const tx = (store, mode) => db.transaction(store, mode).objectStore(store);
      const done = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
      resolve({
        kind: "indexeddb", reason: "",
        getAll(){
          return new Promise((res, rej) => {
            const r = tx(STORE_LISTINGS, "readonly").getAll();
            r.onsuccess = () => res(r.result || []);
            r.onerror = () => rej(r.error);
          });
        },
        putMany(list){
          const t = db.transaction(STORE_LISTINGS, "readwrite");
          const os = t.objectStore(STORE_LISTINGS);
          for (const row of list) os.put(row);
          return done(t);
        },
        deleteMany(ids){
          const t = db.transaction(STORE_LISTINGS, "readwrite");
          const os = t.objectStore(STORE_LISTINGS);
          for (const id of ids) os.delete(Number(id));
          return done(t);
        },
        clear(){
          const t = db.transaction(STORE_LISTINGS, "readwrite");
          t.objectStore(STORE_LISTINGS).clear();
          return done(t);
        },
        getMeta(k){
          return new Promise((res, rej) => {
            const r = tx(STORE_META, "readonly").get(k);
            r.onsuccess = () => res(r.result === undefined ? null : r.result);
            r.onerror = () => rej(r.error);
          });
        },
        setMeta(k, v){
          const t = db.transaction(STORE_META, "readwrite");
          t.objectStore(STORE_META).put(v, k);
          return done(t);
        }
      });
    };
  });
}

/** ============ Catalog + search index ====================================== */

/* Fold case and accents and strip punctuation so "14K Gold-Filled" matches a
   query of "14k gold filled". Computed once per listing at ingest, not per
   keystroke — this is what keeps a 5,600-row scan under a frame. */
function normalizeText(v){
  return String(v == null ? "" : v)
    .normalize("NFKD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function pickPrimaryImage(images){
  if (!Array.isArray(images) || !images.length) return "";
  const best = images.find(x => x && x.is_primary) ||
               [...images].sort((a,b) => (a?.rank ?? 999) - (b?.rank ?? 999))[0] ||
               images[0];
  return best?.url_fullxfull || best?.url_570xN || "";
}

/* Rows synced before the size bump hold a 570px URL. Etsy's CDN names the
   sizes in the filename, so the full-size variant of an already-cached URL is
   derivable without a resync — worth it, because rebuilding the catalog to
   improve pictures would cost ~57 API calls. Strictly the known pattern only,
   and the card falls back to the stored URL if the guess 404s. */
const ETSY_570 = /\/il_570xN\./;
function upgradeImageUrl(url){
  const u = String(url || "");
  return ETSY_570.test(u) ? u.replace(ETSY_570, "/il_fullxfull.") : u;
}

function skusFromInventory(inventory){
  const products = inventory && Array.isArray(inventory.products) ? inventory.products : [];
  const out = [];
  for (const p of products){
    const sku = String(p?.sku || "").trim();
    if (sku) out.push(sku);
  }
  return out;
}

/* Etsy's field name for "when did this listing last change" differs by
   endpoint and by the legacy flag, so take whichever arrived. */
function listingUpdatedAt(x){
  const v = x?.last_modified_timestamp ?? x?.updated_timestamp ?? x?.state_timestamp ?? x?.original_creation_timestamp;
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}

/* The stored shape. Deliberately small — 5,600 of these sit in memory and in
   IndexedDB — and it carries its own precomputed search key. */
function toRecord(x){
  const title = String(x.title || "");
  // The catalog projection sends `image` and `sku` already reduced; a full
  // Etsy listing (the fallback path, and older cached responses) still carries
  // the raw images array and inventory document.
  const sku = typeof x.sku === "string" ? x.sku : (skusFromInventory(x.inventory)[0] || "");
  const image = typeof x.image === "string" ? x.image : pickPrimaryImage(x.images);
  return {
    listing_id: Number(x.listing_id),
    title,
    sku,
    image,
    price: x.price || null,
    section_id: x.shop_section_id == null ? null : Number(x.shop_section_id),
    updated: listingUpdatedAt(x),
    // Search keys, normalized once at ingest: `q` is everything, `qsku` is the
    // SKU alone so "sku:" can narrow to it without re-normalizing per keystroke.
    q: normalizeText(title + " " + sku + " " + x.listing_id),
    qsku: normalizeText(sku)
  };
}

const Catalog = {
  rows: [],
  byId: new Map(),
  store: null,
  sections: [],          // [{ shop_section_id, title, active_listing_count }]
  lastSync: 0,
  shopCount: null,       // Etsy's own active count, for drift detection

  async open(){
    this.store = await openCatalogStore();
    const [rows, sections, lastSync, shopCount] = await Promise.all([
      this.store.getAll(),
      this.store.getMeta("sections"),
      this.store.getMeta("lastSync"),
      this.store.getMeta("shopCount")
    ]);
    this.rows = Array.isArray(rows) ? rows : [];
    this.sections = Array.isArray(sections) ? sections : [];
    this.lastSync = Number(lastSync) || 0;
    this.shopCount = shopCount == null ? null : Number(shopCount);
    this.reindex();
    return this;
  },

  reindex(){
    this.byId = new Map(this.rows.map(r => [r.listing_id, r]));
  },

  async upsert(records){
    if (!records.length) return 0;
    let added = 0;
    for (const r of records){
      const prev = this.byId.get(r.listing_id);
      if (prev) Object.assign(prev, r);
      else { this.rows.push(r); this.byId.set(r.listing_id, r); added++; }
    }
    await this.store.putMany(records.map(r => this.byId.get(r.listing_id)));
    return added;
  },

  /* Patch one row after a SKU write so search and the "missing SKU" filter
     stay truthful without another Etsy read. */
  async setSku(listingId, sku){
    const row = this.byId.get(Number(listingId));
    if (!row) return;
    row.sku = sku;
    row.q = normalizeText(row.title + " " + sku + " " + row.listing_id);
    row.qsku = normalizeText(sku);
    await this.store.putMany([row]);
  },

  async reset(){
    this.rows = []; this.byId = new Map(); this.lastSync = 0;
    await this.store.clear();
    await this.store.setMeta("lastSync", 0);
  }
};

/** ============ Search ======================================================
 *
 * A linear scan over ~5,600 precomputed strings runs in ~2-4ms, so there is no
 * debounce and no worker: every keystroke re-filters and re-renders from the
 * top. Ranking puts whole-word and prefix hits above mid-word ones, which is
 * what makes typing "gold" feel like it found the right things first.
 */
/* "sku:" narrows the search to the SKU field alone. Without it a query still
   matches SKUs — they are part of every row's search key — but a short code
   like "108" drowns in title matches, and this is the escape hatch for that.
   The matched text is highlighted on the card either way, so it is always
   visible WHY a row is in the results. */
const SKU_PREFIX = /^\s*sku\s*:\s*/i;

function parseQuery(rawQuery){
  const raw = String(rawQuery || "");
  const skuOnly = SKU_PREFIX.test(raw);
  const q = normalizeText(skuOnly ? raw.replace(SKU_PREFIX, "") : raw);
  return { skuOnly, terms: q ? q.split(" ").filter(Boolean) : [] };
}

function searchCatalog(rows, rawQuery, { sectionId, missingSkuOnly }){
  const { skuOnly, terms } = parseQuery(rawQuery);
  const out = [];

  for (const r of rows){
    if (sectionId !== null && r.section_id !== sectionId) continue;
    if (missingSkuOnly && r.sku) continue;

    const hay = skuOnly ? (r.qsku || "") : r.q;
    if (!terms.length){
      if (skuOnly && !hay) continue;       // "sku:" alone lists everything that has one
      out.push({ r, score: 0 });
      continue;
    }

    let score = 0, ok = true;
    for (const t of terms){
      const at = hay.indexOf(t);
      if (at === -1){ ok = false; break; }
      // 0 = starts the record, 1 = starts a word, 2 = mid-word
      if (at === 0) score += 0;
      else if (hay[at-1] === " ") score += 1;
      else score += 2;
    }
    if (!ok) continue;
    out.push({ r, score });
  }

  // Stable-ish ordering: best match first, then newest-modified, so an empty
  // query shows recently touched listings rather than an arbitrary slice.
  out.sort((a,b) => (a.score - b.score) || (b.r.updated - a.r.updated));
  return out.map(x => x.r);
}

/** ============ Sync engine =================================================
 *
 * Every response from the proxy reports `etsy_call_count` — a real count from
 * the server, not an estimate — so the console can show exactly what it spent.
 */
const PAGE = 100;              // Etsy's maximum page size: fewest calls per listing
const Budget = {
  KEY: "sku_api_spend_v1",
  today(){ return new Date().toISOString().slice(0,10); },
  read(){
    try {
      const j = JSON.parse(localStorage.getItem(this.KEY) || "{}");
      return (j && j.day === this.today()) ? Number(j.n) || 0 : 0;
    } catch { return 0; }
  },
  add(n){
    const total = this.read() + (Number(n) || 0);
    try { localStorage.setItem(this.KEY, JSON.stringify({ day: this.today(), n: total })); } catch (_) {}
    return total;
  }
};

function countCalls(payload){
  const n = Number(payload && payload.etsy_call_count);
  if (Number.isFinite(n) && n > 0) Budget.add(n);
  return Number.isFinite(n) ? n : 0;
}

/* A function response is capped at 6 MB. projection=catalog keeps a
   100-listing page at roughly 25 KB by reducing each listing server-side to
   the fields the index needs, so the cap is never approached — see
   projectCatalogRow in etsyShopListingsProxy.js. */
function isPayloadTooLarge(status, text){
  return status === 502 && /ResponseSizeTooLarge|payload size/i.test(String(text || ""));
}

async function fetchListingPage(offset, { sortByUpdated = true, limit = PAGE } = {}){
  const qs = new URLSearchParams({
    limit: String(limit),
    offset: String(offset),
    state: "active",
    includes: "Images,Inventory",
    projection: "catalog"
  });
  if (sortByUpdated){ qs.set("sort_on", "updated"); qs.set("sort_order", "desc"); }

  const r = await apiFetch(`/etsyShopListingsProxy?${qs.toString()}`);
  const text = await r.text();
  let js = {};
  try { js = JSON.parse(text); } catch { js = { error: text.slice(0, 300) }; }
  countCalls(js);
  if (!r.ok){
    const err = new Error(`Etsy listings read failed (HTTP ${r.status}): ${js.error || text.slice(0,200)}`);
    err.tooLarge = isPayloadTooLarge(r.status, text);
    throw err;
  }
  return {
    results: Array.isArray(js.results) ? js.results : [],
    total: Number(js.count) || null,
    projection: (js._meta && js._meta.projection) || "full"
  };
}

/* Section chips are the console's primary navigation, so they are loaded
   independently of the catalog walk: a sync that fails partway used to leave
   the operator with no section shortcuts at all. One call, cached thereafter. */
async function ensureSections(){
  if (Catalog.sections.length || !getAccessToken()) return Catalog.sections;
  try {
    const sections = await fetchSections();
    if (sections.length){
      Catalog.sections = sections;
      await Catalog.store.setMeta("sections", sections);
    }
  } catch (e){
    console.warn("Could not load shop sections", e);
  }
  return Catalog.sections;
}

async function fetchSections(){
  const r = await apiFetch(`/etsyShopListingsProxy?mode=sections`);
  const js = await r.json().catch(() => ({}));
  countCalls(js);
  if (!r.ok) return [];
  const rows = Array.isArray(js.results) ? js.results : [];
  return rows.map(s => ({
    shop_section_id: Number(s.shop_section_id),
    title: String(s.title || "Untitled"),
    active_listing_count: Number(s.active_listing_count) || 0
  }));
}

let __syncing = false;
/**
 * mode "full"        — walk the whole shop (~57 calls at 5,600 listings).
 * mode "incremental" — walk newest-modified first and stop at the first page
 *                      entirely older than the last sync (usually 1 call).
 */
async function syncCatalog(mode = "incremental", onProgress = () => {}){
  if (__syncing) return { skipped: true };
  __syncing = true;
  const startedAt = Date.now();
  const since = Catalog.lastSync;
  const doIncremental = mode === "incremental" && since > 0 && Catalog.rows.length > 0;

  let offset = 0, seen = 0, added = 0, pages = 0, total = null, stopped = "";
  // Shrinks if a page ever comes back over the function's response cap — with
  // the catalog projection it never should, but a shop full of unusually large
  // listings, or an older deploy without the projection, degrades to smaller
  // pages instead of failing the whole sync.
  let pageSize = PAGE;
  try {
    for (;;){
      let results, t, projection;
      try {
        ({ results, total: t, projection } = await fetchListingPage(offset, { sortByUpdated: true, limit: pageSize }));
        // The server answered without projecting (an older deploy, or an Etsy
        // response it could not project). Full listings are orders of magnitude
        // larger, so drop to a page size that still fits the 6 MB cap rather
        // than marching into a failure on the next page.
        if (projection !== "catalog" && pageSize > 10){
          pageSize = 10;
          console.warn("Server did not apply the catalog projection (" + projection + "); using " + pageSize + " per page");
        }
      } catch (e){
        if (e && e.tooLarge && pageSize > 10){
          pageSize = Math.max(10, Math.floor(pageSize / 2));
          console.warn("Listing page too large; retrying at " + pageSize + " per page");
          pages++;                       // the failed attempt still cost a call
          continue;
        }
        throw e;
      }
      if (t != null) total = t;
      pages++;
      if (!results.length){ stopped = "end"; break; }

      const records = results.map(toRecord);
      added += await Catalog.upsert(records);
      seen += records.length;

      onProgress({
        seen, added, pages,
        total: doIncremental ? null : total,
        catalog: Catalog.rows.length
      });

      if (doIncremental){
        // Newest-modified first: once a whole page predates the last sync,
        // everything after it does too.
        const newest = Math.max(...records.map(r => r.updated), 0);
        if (newest && newest <= since){ stopped = "caught-up"; break; }
      }

      if (results.length < pageSize){ stopped = "end"; break; }
      offset += pageSize;
      if (offset > 20000){ stopped = "guard"; break; }   // never loop forever
    }

    Catalog.lastSync = Math.floor(startedAt / 1000);
    await Catalog.store.setMeta("lastSync", Catalog.lastSync);
    if (total != null){
      Catalog.shopCount = total;
      await Catalog.store.setMeta("shopCount", total);
    }
    return { seen, added, pages, total, stopped, full: !doIncremental };
  } finally {
    __syncing = false;
  }
}

/** ============ Image zoom ==================================================
 *
 * Ported from the batch-review console's attachPreviewBoxListeners(), which
 * took it verbatim from Listing_Generator_1. Same transform order
 * `scale(S) translate(X,Y)` — offsets are pre-scale units, which is why they
 * are divided by scale when clamping — same MAX_SCALE 8, same 0.5-damped drag,
 * same click-to-zoom-at-point maths, same ResizeObserver re-clamp.
 *
 * TWO DELIBERATE OMISSIONS, both because this console is not that one:
 *
 *  1. No wheel handler. The source zooms on scroll with preventDefault, which
 *     is exactly why the page would not scroll while the pointer sat over a
 *     picture — and with an infinitely scrolling grid of them, that is most of
 *     the window. Removing it is the point of the change; click-to-zoom
 *     replaces it.
 *  2. No persistZoom. The source saved framing per slot into its batch
 *     document because the framing is baked into the uploaded photo. Here a
 *     card is just a view of a catalog row and is rebuilt as the grid scrolls,
 *     so there is nothing to persist and nothing to persist it to.
 */
function attachZoom(box, img){
  const MAX_SCALE = 8, dragThreshold = 3;
  img.dataset.scale = 1; img.dataset.offsetX = 0; img.dataset.offsetY = 0;

  function clampAndApply(im, scale, offX, offY){
    const viewportW = box.clientWidth;
    const viewportH = box.clientHeight;
    const baseW = im.clientWidth;
    const baseH = im.clientHeight;

    /* A zero dimension means "cannot clamp yet", not "clamp to nothing" — the
       first call can land before the browser has laid the image out. Apply the
       transform faithfully and let the load / ResizeObserver pass re-clamp once
       real geometry exists. */
    if (!viewportW || !viewportH || !baseW || !baseH){
      im.dataset.scale = scale; im.dataset.offsetX = offX; im.dataset.offsetY = offY;
      im.style.transform = `scale(${scale}) translate(${offX}px, ${offY}px)`;
      return;
    }

    const scaledW = baseW * scale;
    const scaledH = baseH * scale;

    const maxX = Math.max(0, (scaledW - viewportW) / 2 / scale);
    const maxY = Math.max(0, (scaledH - viewportH) / 2 / scale);

    offX = Math.max(-maxX, Math.min(maxX, offX));
    offY = Math.max(-maxY, Math.min(maxY, offY));

    im.dataset.scale = scale;
    im.dataset.offsetX = offX;
    im.dataset.offsetY = offY;
    im.style.transform = `scale(${scale}) translate(${offX}px, ${offY}px)`;
  }

  const reclamp = () => clampAndApply(img,
    parseFloat(img.dataset.scale) || 1,
    parseFloat(img.dataset.offsetX) || 0,
    parseFloat(img.dataset.offsetY) || 0);

  img.addEventListener("load", reclamp, { once: true });

  if (typeof ResizeObserver !== "undefined"){
    const ro = new ResizeObserver(() => {
      const im = box.querySelector("img");
      if (im) clampAndApply(im, parseFloat(im.dataset.scale) || 1,
                            parseFloat(im.dataset.offsetX) || 0,
                            parseFloat(im.dataset.offsetY) || 0);
    });
    ro.observe(box);
  }

  let isDragging = false, isMouseDown = false;
  let dragStartX = 0, dragStartY = 0, lastX = 0, lastY = 0;

  box.addEventListener("mousedown", function (ev){
    const im = box.querySelector("img");
    if (!im) return;
    const scaleNow = parseFloat(im.dataset.scale) || 1;
    if (scaleNow <= 1) return;              // nothing to pan until zoomed in
    ev.preventDefault();
    isMouseDown = true;
    isDragging = false;
    dragStartX = ev.clientX; dragStartY = ev.clientY;
    lastX = ev.clientX; lastY = ev.clientY;
  });

  box.addEventListener("mousemove", function (ev){
    if (!isMouseDown) return;
    ev.preventDefault();
    const dxAll = Math.abs(ev.clientX - dragStartX);
    const dyAll = Math.abs(ev.clientY - dragStartY);
    if (dxAll > dragThreshold || dyAll > dragThreshold) isDragging = true;

    const im = box.querySelector("img");
    if (!im) return;
    const scaleNow = parseFloat(im.dataset.scale) || 1;
    let offX = parseFloat(im.dataset.offsetX) || 0;
    let offY = parseFloat(im.dataset.offsetY) || 0;
    const dx = (ev.clientX - lastX) * 0.5;
    const dy = (ev.clientY - lastY) * 0.5;
    offX += dx; offY += dy;
    clampAndApply(im, scaleNow, offX, offY);
    lastX = ev.clientX; lastY = ev.clientY;
  });

  const endPan = () => { isMouseDown = false; };
  box.addEventListener("mouseup", endPan);
  box.addEventListener("mouseleave", endPan);

  box.addEventListener("click", function (ev){
    if (isDragging){ isDragging = false; return; }   // a pan is not a click
    const im = box.querySelector("img");
    if (!im) return;

    const s0    = parseFloat(im.dataset.scale)   || 1;
    const offX0 = parseFloat(im.dataset.offsetX) || 0;
    const offY0 = parseFloat(im.dataset.offsetY) || 0;

    const rect = box.getBoundingClientRect();
    const cx = rect.left + box.clientWidth  / 2;
    const cy = rect.top  + box.clientHeight / 2;
    const dx_screen = ev.clientX - cx;
    const dy_screen = ev.clientY - cy;

    const px = dx_screen / s0 - offX0;
    const py = dy_screen / s0 - offY0;

    let targetOffX = -px;
    let targetOffY = -py;

    const halfW = (im.clientWidth  || 120) / 2;
    const halfH = (im.clientHeight || 120) / 2;
    function requiredScaleFor(delta, half){
      const ratio = Math.abs(delta) / half;
      if (ratio >= 1) return Infinity;
      return 1 / (1 - ratio);
    }
    const needX = requiredScaleFor(targetOffX, halfW);
    const needY = requiredScaleFor(targetOffY, halfH);

    const DESIRED = 1.33;
    let s1 = Math.max(DESIRED, s0 * 1.5, needX, needY);
    if (!Number.isFinite(s1)) s1 = MAX_SCALE;
    if (s1 > MAX_SCALE) s1 = MAX_SCALE;

    if (s0 > 1.2 && Math.abs(s1 - s0) < 0.5) s1 = 1;   // click again to come back

    if (s1 === 1){ targetOffX = 0; targetOffY = 0; }
    clampAndApply(im, s1, targetOffX, targetOffY);
  });
}

function sectionCounts(){
  const counts = new Map();
  let none = 0;
  for (const r of Catalog.rows){
    if (r.section_id == null) none++;
    else counts.set(r.section_id, (counts.get(r.section_id) || 0) + 1);
  }

}

function renderChips(){
  chipRow.innerHTML = "";

  const chip = (label, count, on, onClick, extraClass) => {
    const b = document.createElement("button");
    b.className = "chip" + (on ? " on" : "") + (extraClass ? " " + extraClass : "");
    b.type = "button";
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.append(document.createTextNode(label));
    if (count != null){
      const n = document.createElement("span");
      n.className = "n";
      n.textContent = String(count);
      b.appendChild(n);
    }
    b.addEventListener("click", onClick);
    chipRow.appendChild(b);
    return b;
  };

  chip("All", Catalog.rows.length, sectionId === null,
    () => { sectionId = null; renderChips(); applyFilters(); });

  /* Only the shortcuts named in SECTION_CHIPS, in that order. A name with no
     matching section in the shop is simply skipped rather than shown dead. */
  const byName = new Map(
    Catalog.sections.map(sec => [String(sec.title || "").trim().toLowerCase(), sec])
  );
  for (const wanted of SECTION_CHIPS){

    if (!sec) continue;
    chip(sec.title, counts.get(sec.shop_section_id) || 0, sectionId === sec.shop_section_id,
      () => { sectionId = sec.shop_section_id; renderChips(); applyFilters(); });
  }

  const sep = document.createElement("span");
  sep.className = "chipsep";
  chipRow.appendChild(sep);

  chip("Missing SKU", null, missingSkuOnly,
    () => { missingSkuOnly = !missingSkuOnly; renderChips(); applyFilters(); }, "flag");
}

function formatPrice(price){

  const divisor = Number(price.divisor) || 100;
  if (!Number.isFinite(amount)) return "";
  return `${(amount / divisor).toFixed(2)} ${price.currency_code || ""}`.trim();
}

/* Highlights the matched terms. Matching itself is fold-insensitive (see
   normalizeText), but the highlight only marks terms that appear literally in
   the title — a fold-only match such as "rose" against "Rosé" still lists the
   listing, it just is not underlined. Built from text nodes, never parsed
   HTML: the title is shop data. */
function highlightInto(el, text, terms){
  el.textContent = "";
  if (!terms.length){ el.textContent = text; return; }

  const hay = text.toLowerCase();
  const spans = [];
  for (const t of terms){
    let from = 0, at;
    while ((at = hay.indexOf(t, from)) !== -1){ spans.push([at, at + t.length]); from = at + t.length; }
  }
  if (!spans.length){ el.textContent = text; return; }

  spans.sort((a,b) => a[0] - b[0]);
  const merged = [spans[0]];
  for (const [a,b] of spans.slice(1)){
    const last = merged[merged.length - 1];
    if (a <= last[1]) last[1] = Math.max(last[1], b);
    else merged.push([a,b]);
  }

  let cursor = 0;
  for (const [a,b] of merged){
    if (a > cursor) el.appendChild(document.createTextNode(text.slice(cursor, a)));
    const m = document.createElement("mark");
    m.textContent = text.slice(a, b);
    el.appendChild(m);
    cursor = b;
  }
  if (cursor < text.length) el.appendChild(document.createTextNode(text.slice(cursor)));
}

/* ── The SKU line ──────────────────────────────────────────────────────────
 *
 * One control, three states:
 *
 *   reading   the SKU as large bold text; clicking it starts editing
 *   editing   an input with save and cancel, opened INSTANTLY from the cached
 *             value — the product_id needed for the write is fetched in the
 *             background, so the Etsy round trip no longer sits between the
 *             click and the cursor
 *   pending   a generated SKU that is only a proposal: amber dot, the word
 *             UNSAVED, and an outlined card until it is saved or discarded
 *
 * Generate never writes. It fills the field and leaves it pending, so a
 * generated value that is not saved is simply gone on refresh — which is what
 * the marker warns about.
 */
function buildSkuLine(card, r, terms){
  const line = document.createElement("div");
  line.className = "skuline";
  line.dataset.role = "sku-line";

  const label = document.createElement("span");
  label.className = "skulabel";
  label.textContent = "SKU";
  line.appendChild(label);

  /* The product_id is only needed to WRITE. Fetching it is what made the old
     Edit button take seconds, so it is started in the background the moment
     editing begins and awaited only at save time. */
  let productIdPromise = null;
  const primeProductId = () => {
    if (!productIdPromise){
      productIdPromise = fetchInventoryDetail(r.listing_id)
        .then(products => {
          const p0 = (Array.isArray(products) && products.length) ? products[0] : null;
          if (!p0 || p0.product_id == null) throw new Error("This listing has no Variant 1 to write to");
          return Number(p0.product_id);
        })
        .catch(err => { productIdPromise = null; throw err; })
        .finally(renderMeters);
    }
    return productIdPromise;
  };

  let mode = "reading";     // reading | editing | pending
  let draft = r.sku || "";

  function paint(){
    [...line.querySelectorAll(".skuvalue, .skuinput, .iconbtn, .unsaved")].forEach(el => el.remove());

    if (mode === "reading"){
      const value = document.createElement("button");
      value.type = "button";
      value.className = "skuvalue" + (r.sku ? "" : " none");
      value.dataset.role = "sku-value";
      value.title = "Click to edit this SKU";
      if (r.sku) highlightInto(value, r.sku, terms);
      else value.textContent = "— none —";
      value.addEventListener("click", () => { mode = "editing"; draft = r.sku || ""; primeProductId().catch(() => {}); paint(); });
      line.appendChild(value);

      if (r.sku){
        const copy = document.createElement("button");
        copy.type = "button";
        copy.className = "iconbtn copy grow";
        copy.dataset.role = "sku-copy";
        copy.title = "Copy this SKU";
        copy.textContent = "\u29c9";
        copy.addEventListener("click", async (ev) => {
          ev.stopPropagation();                       // copying is not editing
          const ok = await copyText(r.sku);
          copy.textContent = ok ? "\u2713" : "\u2715";
          copy.classList.toggle("done", ok);
          setTimeout(() => {
            copy.textContent = "\u29c9";
            copy.classList.remove("done");
          }, 1100);
        });
        line.appendChild(copy);
      }

      card.classList.remove("pending");
      return;
    }

    const input = document.createElement("input");
    input.type = "text";
    input.className = "skuinput";
    input.maxLength = 64;
    input.value = draft;
    input.addEventListener("input", () => { draft = input.value; });
    line.appendChild(input);

    if (mode === "pending"){
      const flag = document.createElement("span");
      flag.className = "unsaved";
      flag.dataset.role = "unsaved";
      flag.textContent = "Unsaved";
      flag.title = "Generated but not written to Etsy — it is lost on refresh until you save";
      line.appendChild(flag);
      card.classList.add("pending");
    } else {
      card.classList.remove("pending");
    }

    const save = document.createElement("button");
    save.type = "button";
    save.className = "iconbtn save";
    save.dataset.role = "sku-save";
    save.title = "Save to Etsy";
    save.textContent = "\u2713";

    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.className = "iconbtn cancel";
    cancel.dataset.role = "sku-cancel";
    cancel.title = "Discard";
    cancel.textContent = "\u2715";
    cancel.addEventListener("click", () => { mode = "reading"; draft = r.sku || ""; paint(); });

    save.addEventListener("click", async () => {
      const wanted = String(draft || "").trim();
      save.disabled = true; cancel.disabled = true;
      save.textContent = "";
      save.appendChild(Object.assign(document.createElement("span"), { className: "spin" }));
      try {
        const productId = await primeProductId();
        if (await saveSkuUpdates(r.listing_id, [{ product_id: productId, sku: wanted }])){
          r.sku = wanted;
          await Catalog.setSku(r.listing_id, wanted);
          mode = "reading";
          paint();
          repaintGenerateButton(card, r);
        }
      } catch (e){
        alert("Could not save the SKU: " + e.message);
      } finally {
        save.disabled = false; cancel.disabled = false;
        save.textContent = "\u2713";
        renderMeters();
      }
    });

    input.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") return save.click();
      if (ev.key === "Escape") return cancel.click();
    });

    line.appendChild(save);
    line.appendChild(cancel);
    input.focus();
  }

  /* Generate hands the line a proposal; it does not write. */
  line.proposeSku = (value) => { mode = "pending"; draft = value; primeProductId().catch(() => {}); paint(); };
  line.currentMode = () => mode;

  paint();
  return line;
}

/* navigator.clipboard needs a secure context, which this origin is, but it
   still rejects when the document is not focused or permission is refused —
   so a textarea + execCommand stands behind it. */
async function copyText(text){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (_) { /* fall through */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch (_) { return false; }
}

function repaintGenerateButton(card, r){
  const gen = card.querySelector('[data-role="gen-btn"]');
  if (!gen) return;
  gen.style.background = r.sku ? "" : "OrangeRed";
  gen.title = r.sku ? "Replace this SKU with a generated one" : "No SKU yet \u2014 click Generate";
}

function buildCard(r, terms){
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.listingId = String(r.listing_id);

  const wrap = document.createElement("div");
  wrap.className = "thumb-wrap";
  const img = document.createElement("img");
  img.className = "thumb";
  img.alt = r.title || "Listing image";
  img.loading = "lazy";
  img.decoding = "async";
  const upgraded = upgradeImageUrl(r.image);
  if (upgraded !== r.image){
    // One retry at the stored size if the derived full-size URL does not exist.
    img.addEventListener("error", () => {
      if (img.dataset.fellBack) return;
      img.dataset.fellBack = "1";
      img.src = r.image || "";
    }, { once: true });
  }
  img.src = upgraded || "";
  wrap.appendChild(img);
  attachZoom(wrap, img);
  card.appendChild(wrap);

  const meta = document.createElement("div");
  meta.className = "meta";

  const title = document.createElement("div");
  title.className = "title";
  title.title = r.title || "";            // the full title, since the line clips
  highlightInto(title, r.title || "(untitled)", terms);
  meta.appendChild(title);

  const skuLine = buildSkuLine(card, r, terms);
  meta.appendChild(skuLine);

  /* One row: section, then Generate. The listing id, price and done-checkbox
     were removed at the operator's request — the id and price are not part of
     the SKU task, and with the checkbox gone the "Hide done" chip it fed has
     gone too. The stored selections are left untouched in localStorage, so
     nothing is lost if the feature comes back. */
  const row = document.createElement("div");
  row.className = "row";

  const sect = sectionTitle(r.section_id);
  if (sect){
    const sp = document.createElement("span");
    sp.className = "pill sect";
    sp.textContent = sect;
    row.appendChild(sp);
  }

  const genBtn = document.createElement("button");
  genBtn.type = "button";
  genBtn.className = "btn tiny grow";
  genBtn.textContent = "Generate";
  genBtn.dataset.role = "gen-btn";
  genBtn.addEventListener("click", () => {
    skuLine.proposeSku(makeSkuFrom(r.title || "", r.listing_id));
  });
  row.appendChild(genBtn);

  meta.appendChild(row);
  card.appendChild(meta);

  repaintGenerateButton(card, r);
  return card;
}

let currentTerms = [];

/* Appends the next slice. Called on filter change and by the scroll sentinel;
   the DOM only ever holds what has actually been scrolled to. */
function renderMore(){
  if (rendered >= results.length) return 0;
  const slice = results.slice(rendered, rendered + CHUNK);
  const frag = document.createDocumentFragment();
  for (const r of slice) frag.appendChild(buildCard(r, currentTerms));
  listContainer.appendChild(frag);
  rendered += slice.length;
  renderMeters();
  updateEndcap();
  return slice.length;
}

function updateEndcap(){
  if (!results.length){ endcap.textContent = ""; return; }
  endcap.textContent = rendered >= results.length
    ? `— end of ${results.length} listing${results.length === 1 ? "" : "s"} —`
    : "Loading more…";
}

function applyFilters(){
  currentTerms = parseQuery(searchInput.value).terms;
  results = searchCatalog(Catalog.rows, searchInput.value, { sectionId, missingSkuOnly });

  listContainer.innerHTML = "";
  rendered = 0;
  searchClear.style.display = searchInput.value ? "block" : "none";
  document.getElementById("searchHint").style.display = searchInput.value ? "none" : "block";

  if (!Catalog.rows.length){
    showNotice(getAccessToken()
      ? "Building the local catalog from Etsy — about one call per 100 listings, once. Every search after that runs locally and costs no API calls."
      : "Connect Etsy to begin.");
    renderMeters();
    endcap.textContent = "";
    return;
  }
  if (!results.length){
    showNotice("No listings match these filters.");
    renderMeters();
    endcap.textContent = "";
    return;
  }
  renderMore();
  // Fill the first screen even on a tall display.
  if (rendered < results.length && listContainer.getBoundingClientRect().bottom < (window.innerHeight || 900)) renderMore();
  window.scrollTo({ top: 0 });
}

/** ============ SKU write paths ============ */
async function fetchInventoryDetail(listingId){
  const r = await apiFetch(`/etsyListingInventoryDetailProxy?listingId=${encodeURIComponent(listingId)}`);
  const js = await r.json().catch(() => ({}));
  countCalls(js);
  if (!r.ok) throw new Error(`Failed to fetch inventory ${listingId} (HTTP ${r.status})`);
  return Array.isArray(js.products) ? js.products : [];
}

async function saveSkuUpdates(listingId, items){
  const r = await apiFetch(`/etsyUpdateListingInventoryProxy`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ listing_id: Number(listingId), items })
  });
  const text = await r.text();
  let js = {};
  try { js = JSON.parse(text); } catch { js = {}; }
  countCalls(js);
  if (!r.ok) throw new Error(`HTTP ${r.status}: ${text}`);
  return !!js.ok;
}

function cardFor(listingId){
  return listContainer.querySelector(`.card[data-listing-id="${listingId}"]`);
}

/* Repaints one card in place after a SKU write — no refetch, no re-render of
   the grid, so the user's scroll position survives. */
function makeSkuFrom(title, listingId){
  const last4 = String(listingId).slice(-4);
  const firstWordMatch = String(title || "").match(/[A-Za-z0-9]+/);
  const raw = firstWordMatch ? firstWordMatch[0] : "SKU";
  const pretty = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
  return `${pretty}_${last4}`;
}

/** ============ Sync driver ============ */
function setSyncProgress(pct){
  syncProgress.style.width = (pct == null ? 0 : Math.max(0, Math.min(100, pct))) + "%";
}

async function runSync(mode){
  if (!getAccessToken()){ setStatus("Connect Etsy first", "bad"); return; }
  syncBtn.disabled = true;
  const wasEmpty = !Catalog.rows.length;
  const label = syncBtn.textContent;
  try {
    syncBtn.textContent = "Syncing…";
    const res = await syncCatalog(mode, ({ seen, total, pages }) => {
      setSyncProgress(total ? (seen / total) * 100 : null);
      syncBtn.textContent = `Syncing ${seen}…`;
      renderMeters();
      // Let the operator start working while a first full build is still running.
      if (wasEmpty && pages % 5 === 0 && !searchInput.value && !window.scrollY){
        renderChips();
        applyFilters();
      }
    });
    if (res && res.skipped) return;

    renderChips();
    applyFilters();
    setStatus(res.full
      ? `Catalog built · ${res.seen} listings · ${res.pages} calls`
      : `Up to date · ${res.added} new · ${res.pages} call${res.pages === 1 ? "" : "s"}`, "ok");
  } catch (e){
    console.error("Sync failed", e);
    setStatus(`Sync failed (build ${BUILD}): ` + e.message, "bad");
  } finally {
    setSyncProgress(0);
    syncBtn.disabled = false;
    syncBtn.textContent = label;
    renderMeters();
  }
}

/** ============ Boot ============ */
function bootOAuth(){
  const url = new URLSearchParams(location.search);

  const access_token  = url.get("access_token");
  const refresh_token = url.get("refresh_token");
  const expires_in    = url.get("expires_in");
  const issued_at     = url.get("issued_at");
  if (access_token && refresh_token && expires_in && issued_at){
    setTokens({ access_token, refresh_token, expires_in, issued_at });
    history.replaceState({}, "", ORIGIN + location.pathname);
    setStatus("Connected", "ok");
    return "tokens";
  }

  const err = url.get("error");
  if (err){
    history.replaceState({}, "", ORIGIN + location.pathname);
    setStatus("Etsy sign-in failed", "bad");
    console.error("Etsy OAuth error:", err, url.get("error_description") || "");
    return "error";
  }

  const code = url.get("code");
  if (code){
    const state = url.get("state") || "";
    const v = takeVerifier(state);

    let lastCode = null;
    try { lastCode = sessionStorage.getItem("etsy_last_code"); } catch (_) {}
    if (lastCode === code){
      history.replaceState({}, "", ORIGIN + location.pathname);
      setStatus("Sign-in link already used", "bad");
      return "replay";
    }
    if (v){
      try { sessionStorage.setItem("etsy_last_code", code); } catch (_) {}
      dropVerifier(state);
      const qs = new URLSearchParams({ code, code_verifier: v, redirect_domain: "sku" });
      window.location.href = ORIGIN + "/.netlify/functions/exchangeToken?" + qs.toString();
      return "exchange";
    }
    console.error("OAuth callback arrived with no stored code_verifier.", { state });
    history.replaceState({}, "", ORIGIN + location.pathname);
    setStatus("Sign-in did not complete — press Connect Etsy", "bad");
    return "no-verifier";
  }

  if (url.get("connect") === "1"){
    history.replaceState({}, "", ORIGIN + location.pathname);
    return "connect";
  }
  return "none";
}

function wireScrolling(){
  if (typeof IntersectionObserver === "function"){
    new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) renderMore();
    }, { rootMargin: "1200px 0px" }).observe(sentinel);
  } else {
    // Older engines: fall back to a scroll listener with the same trigger point.
    window.addEventListener("scroll", () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 1200) renderMore();
    }, { passive: true });
  }
}

function wireSearch(){
  // No debounce: the scan is local and takes a couple of milliseconds, so the
  // grid updates within the same frame as the keystroke.
  searchInput.addEventListener("input", applyFilters);
  searchClear.addEventListener("click", () => { searchInput.value = ""; applyFilters(); searchInput.focus(); });

  document.addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== searchInput){
      e.preventDefault(); searchInput.focus(); searchInput.select();
    } else if (e.key === "Escape" && document.activeElement === searchInput){
      searchInput.value = ""; applyFilters();
    }
  });
}

document.addEventListener("DOMContentLoaded", async () => {
  const outcome = bootOAuth();
  if (outcome === "exchange") return;

  document.getElementById("connectEtsyBtn").addEventListener("click", () => startOAuth("button"));
  // Plain click = "what changed since last time" (1-2 calls). Shift-click (or
  // right-click) forces a full rebuild — the escape hatch for when the catalog
  // and Etsy's own count have drifted apart, since deletions are invisible to
  // an incremental walk.
  syncBtn.addEventListener("click", (e) => e.shiftKey ? rebuildCatalog() : runSync("incremental"));
  syncBtn.addEventListener("contextmenu", (e) => { e.preventDefault(); rebuildCatalog(); });
  wireSearch();
  wireScrolling();

  await Catalog.open();
  renderChips();
  applyFilters();
  renderMeters();

  if (outcome === "connect"){ await startOAuth("cross-origin"); return; }

  if (getAccessToken() && tokenIsFresh()) scheduleTokenRefresh();
  else if (getRefreshToken()) await refreshAccessToken();
  setAuthBadge();

  if (Catalog.store.kind === "memory"){
    console.warn("Catalog persistence unavailable:", Catalog.store.reason);
  }

  const stamp = document.getElementById("buildStamp");
  if (stamp) stamp.textContent = BUILD;
  searchInput.focus();

  if (getAccessToken()){
    refreshQuota();
    await ensureSections();
    renderChips();
    // A cold catalog builds itself; a warm one only asks for what changed.
    await runSync(Catalog.rows.length ? "incremental" : "full");
  }
});

async function rebuildCatalog(){
  if (!confirm("Rebuild the whole local catalog from Etsy?\n\nThis re-reads every active listing — about " +
               Math.ceil((Catalog.shopCount || Catalog.rows.length || 5600) / PAGE) +
               " Etsy API calls. Use this when the catalog count has drifted from the live count.")) return;
  await Catalog.reset();
  applyFilters();
  await runSync("full");
}
