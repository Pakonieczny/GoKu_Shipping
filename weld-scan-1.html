<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scanner / Generator with Auto Camera & Touch-to-Unlock Audio</title>
  <!-- Materialize CSS (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }
    /* "Send" button: big for easy tapping */
    #sendBtn {
      position: absolute;
      font-size: 600% !important;
    }
    /* hide & disable Send (still usable programmatically) */
    #sendBtn {
    display: none !important;
    pointer-events: none !important;
    }
    /* #qrcode: resizable by config */
    #qrcode {
      position: absolute;
    }
    /* Scanned QR Code text box: big font */
    #orderNumInput {
      position: absolute;
      background: #f9f9f9;
      width: 900px !important;
      height: 150px !important;
      font-size: 600% !important;
    }
    #orderLabel {
      position: absolute;
      font-weight: bold;
      font-size: 600% !important;
    }
    #qrPreviewTitle {
      position: absolute;
      font-weight: bold;
      font-size: 600% !important;
    }
    #openConfigBtnScanner {
      position: absolute;
    }
    #video {
      position: absolute;
      background: #333;
    }
    #captureCanvas {
      position: absolute;
      display: none;
    }
    /* Modal styling for config */
    .modal {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      height: auto !important;
      max-height: 70vh !important;
      width: auto !important;
      max-width: 650px !important;
      overflow-y: auto !important;
    }
    .modal .modal-content {
      font-size: 0.9em;
      text-align: left;
    }
    .modal .modal-footer {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      padding: 10px;
      background: white;
      font-size: 0.9em;
    }
    table.striped {
      width: 100%;
    }
    table.striped th,
    table.striped td {
      padding: 8px;
      text-align: center;
    }
    input[type="number"] {
      width: 70px;
      font-size: 0.8em;
    }
  </style>
</head>
<body>
  <!-- "Open Config" button -->
  <button id="openConfigBtnScanner" class="btn waves-effect waves-light">
    Open Config
  </button>

  <!-- "Order #:" label -->
  <div id="orderLabel">Order #:</div>

  <!-- Scanned code text box -->
  <input type="text" id="orderNumInput" placeholder="(Scanned QR Code)" readonly />

  <!-- "QR Code" title -->
  <div id="qrPreviewTitle">QR Code</div>

  <!-- Container for generated QR code -->
  <div id="qrcode"></div>

  <!-- Video feed -->
  <video id="video" playsinline></video>
  
  <!-- Hidden canvas for scanning frames -->
  <canvas id="captureCanvas" width="640" height="480" style="display:none;"></canvas>

  <!-- "Send" button -->
  <button id="sendBtn" class="btn waves-effect waves-light">Send</button>

  <!-- Config Modal -->
  <div id="configModalScanner" class="modal">
    <div class="modal-content">
      <h5>Layout Config</h5>
      <table class="striped" id="configTableScanner">
        <thead>
          <tr>
            <th>Component</th>
            <th>Left (px)</th>
            <th>Top (px)</th>
            <th>Width (px)</th>
            <th>Height (px)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="modal-footer">
      <button id="saveConfigBtnScanner" class="modal-close btn">Save Config</button>
    </div>
  </div>

  <!-- Local libs for QR scanning & generation -->
  <script src="lib/qrcode.min.js"></script>
  <script src="lib/jsQR.js"></script>
  <!-- Materialize JS (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <!-- Firebase (compat mode) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    /*************************************************************
     * 0) FIREBASE CONFIG (Adjust if needed)
     *************************************************************/
    const firebaseConfig = {
      apiKey: "YourApiKeyHere",
      authDomain: "YourAuthDomainHere",
      projectId: "gokudatabase",
      storageBucket: "gokudatabase.firebasestorage.app",
      messagingSenderId: "1078662308113",
      appId: "1:1078662308113:web:41df0e5d229ff2af7a6cb0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    /*************************************************************
     * 1) GLOBAL VARIABLES
     *************************************************************/
    let stream = null;
    let scanningInterval = null;
    let lastScanned = "";
    let audioUnlocked = false; // We'll beep only if this is true
    let audioCtx = null;       // For Web Audio API

    const video        = document.getElementById("video");
    const canvas       = document.getElementById("captureCanvas");
    const ctx          = canvas.getContext("2d");
    const scannedInput = document.getElementById("orderNumInput");
    const qrcodeDiv    = document.getElementById("qrcode");

    // Use your external MP3 beep from the assets folder
    const beepSound = new Audio("./assets/scannerBeep.mp3");
    beepSound.preload = "auto";
    beepSound.load();

    /*************************************************************
     * 2) PLAY BEEP USING THE MP3 FILE WITH ADJUSTED PARAMETERS
     *************************************************************/
    function playBeep() {
      // If AudioContext is available, use it with modified parameters:
      if (audioCtx) {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = "sine";
        // Increase frequency by 33% twice: 440 Hz * 1.33 * 1.33 ≈ 778 Hz
        oscillator.frequency.setValueAtTime(440 * 1.33 * 1.33, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        oscillator.start();
        // Shorten playback time by 33% twice: 0.2 sec * 0.67 * 0.67 ≈ 0.09 sec
        oscillator.stop(audioCtx.currentTime + 0.2 * 0.67 * 0.67);
      } else {
        // Fallback using the Audio element: set playback rate to 1.33 * 1.33 ≈ 1.77
        beepSound.playbackRate = 1.33 * 1.33;
        beepSound.currentTime = 0;
        beepSound.play().catch(e => console.warn("Beep fallback error:", e));
      }
    }

    /*************************************************************
     * 3) START CAMERA AUTOMATICALLY
     *************************************************************/
    async function startCamera() {
      try {
        // Request environment-facing camera
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = stream;
        video.play();

        // Continuously scan every 500ms
        scanningInterval = setInterval(() => {
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const qrResult = jsQR(frame.data, frame.width, frame.height);
          if (qrResult) {
            handleScannedCode(qrResult.data);
          }
        }, 500);
      } catch (err) {
        console.error("Camera error:", err);
        alert("Could not start camera: " + err.message);
      }
    }

    /*************************************************************
     * 4) HANDLE A NEW QR CODE SCAN
     *************************************************************/
    function handleScannedCode(codeText) {
      if (codeText === lastScanned) return;
      lastScanned = codeText;

      // The same order again within a few seconds (this page reloaded while the QR was still in view, or the camera swung back):
      // it is one scan, not two. The last accepted scan is kept on this phone, so a reload does not forget it.
      const nowMs = Date.now(), again = String(codeText).trim();
      if (again && lastAccepted.n === again && nowMs >= lastAccepted.at && nowMs - lastAccepted.at < DUP_MS) {
        M.toast({ html: "Already scanned: " + again });
        return;
      }

      // If audio is unlocked, play the beep using your MP3 with adjusted parameters
      if (audioUnlocked) {
        playBeep();
      }

      // Display the scanned code
      scannedInput.value = codeText;

      // Render a new QR code in the qrcode container
      qrcodeDiv.innerHTML = "";
      const containerStyles = window.getComputedStyle(qrcodeDiv);
      const containerWidth  = parseInt(containerStyles.width, 10)  || 128;
      const containerHeight = parseInt(containerStyles.height, 10) || 128;
      new QRCode(qrcodeDiv, {
        text: codeText,
        width: containerWidth,
        height: containerHeight
      });

     M.toast({ html: "Scanned: " + codeText });
     // Auto fire "Send" logic: the scan is kept on this phone first and leaves it only when the server has it
     queueScan(codeText);
    }

    /*************************************************************
     * 5) UNLOCK AUDIO ON FIRST TOUCH OR CLICK
     *************************************************************/
    function unlockAudio() {
      // Try initializing/resuming the AudioContext
      if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx) {
        audioCtx.resume().then(() => {
          audioUnlocked = true;
          M.toast({ html: "Audio unlocked via Web Audio API. Beeps will now play." });
        }).catch(e => {
          console.warn("AudioContext resume error:", e);
          // Fallback: try playing the MP3 file with fallback settings
          beepSound.currentTime = 0;
          beepSound.playbackRate = 1.33 * 1.33;
          beepSound.play().then(() => {
            audioUnlocked = true;
            M.toast({ html: "Audio unlocked via MP3 fallback. Beeps will now play." });
          }).catch(err => {
            console.warn("Fallback audio play error:", err);
            M.toast({ html: "Audio still blocked – check your volume/silent mode." });
          });
        });
      } else {
        // If no AudioContext, fallback to MP3 directly
        beepSound.currentTime = 0;
        beepSound.playbackRate = 1.33 * 1.33;
        beepSound.play().then(() => {
          audioUnlocked = true;
          M.toast({ html: "Audio unlocked via MP3 fallback. Beeps will now play." });
        }).catch(err => {
          console.warn("Fallback audio play error:", err);
          M.toast({ html: "Audio still blocked – check your volume/silent mode." });
        });
      }
      // Remove the listeners after first interaction
      window.removeEventListener("touchstart", unlockAudio);
      window.removeEventListener("click", unlockAudio);
    }
    // Attach unlock event listeners to window (covers mobile and desktop)
    window.addEventListener("touchstart", unlockAudio, { once: true });
    window.addEventListener("click", unlockAudio, { once: true });

    /*************************************************************
     * 6) SEND LOGIC (reusable)
     *************************************************************/
    const sendBtn = document.getElementById("sendBtn");
    sendBtn.disabled = true; // hidden & disabled, but kept for config integrity

    /* Every scan is written to the outbox on this phone (localStorage) with its own id and its real scan time, and leaves it only
       when the server has taken it. Offline, or a server hiccup: it stays, is sent again (on reconnect, on a timer, after a
       reload of this page), one at a time and in the order scanned, a couple of seconds apart (the relay document holds one scan
       at a time). The desktop station credits each scan, with its real time, to the people signed in when it arrives (Matching person,
       or "nobody in Matching"): the phone has no login and never says who. The relay document is the one the page always used:
       "Order Number" is the plain order number; "Shipping Label Timestamps" is the scan time; "Staff Note" carries { v, id, at, sent }. */
    const OUTBOX_KEY = "weldScanOutbox.v1";
    const DUP_MS = 10000, SPACING_MS = 2000, RETRY_MS = [3000, 6000, 12000, 30000], OUTBOX_MAX = 300, OUTBOX_KEEP_MS = 6 * 86400000;
    let outbox = [], lastAccepted = { n: "", at: 0 }, sending = false, retryTimer = 0, failures = 0;

    function loadOutbox() {
      try {
        const d = JSON.parse(localStorage.getItem(OUTBOX_KEY) || "null");
        if (!d || d.v !== 1) return;
        const now = Date.now();
        outbox = (Array.isArray(d.items) ? d.items : [])
          .filter(it => it && typeof it.id === "string" && typeof it.n === "string" && it.n && Number(it.at) > 1e12 && now - Number(it.at) < OUTBOX_KEEP_MS)
          .map(it => ({ id: it.id, n: it.n, at: Number(it.at) })).slice(-OUTBOX_MAX);
        if (d.last && typeof d.last.n === "string" && Number(d.last.at) > 0) lastAccepted = { n: d.last.n, at: Number(d.last.at) };
      } catch (e) { console.warn("Could not read the outbox:", e); }
    }
    function saveOutbox() {
      try { localStorage.setItem(OUTBOX_KEY, JSON.stringify({ v: 1, items: outbox, last: lastAccepted })); } catch (e) { console.warn("Could not save the outbox:", e); }
    }
    function newScanId() { return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    function queueScan(codeVal) {
      const code = String(codeVal == null ? "" : codeVal).trim();
      if (!code) {
        M.toast({ html: "No QR code scanned yet!" });
        return;
      }
      const item = { id: newScanId(), n: code, at: Date.now() };
      outbox.push(item);
      if (outbox.length > OUTBOX_MAX) outbox = outbox.slice(-OUTBOX_MAX);
      lastAccepted = { n: code, at: item.at };
      saveOutbox();
      if (outbox.length > 1 || navigator.onLine === false) {
        M.toast({ html: "Saved on this phone: " + outbox.length + " waiting to send" });
      }
      pump();
    }

    /* one request: { ok } sent · { drop } the server will never take it · neither: keep it and try again */
    async function sendOne(item, left) {
      let timer = 0;
      try {
        if (!failures) M.toast({ html: "Sending to Firestore doc 'weld-scan-1': " + item.n });
        const bodyData = {
          orderNumber: "weld-scan-1",
          orderNumField: item.n,
          clientName: "Scanner Page",
          britesMessages: "(Auto push from weld-scan-1.html)",
          shippingLabelTimestamps: new Date(item.at).toISOString(),
          employeeName: "ScannerBot",
          staffNote: JSON.stringify({ v: 1, id: item.id, at: item.at, sent: Date.now(), q: left })
        };
        const ctl = typeof AbortController === "function" ? new AbortController() : null;
        if (ctl) timer = setTimeout(() => { try { ctl.abort(); } catch (_) {} }, 15000);
        const response = await fetch("/.netlify/functions/firebaseOrders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(bodyData),
          signal: ctl ? ctl.signal : undefined
        });
        clearTimeout(timer);
        if (response.ok) { M.toast({ html: "Firestore updated: doc 'weld-scan-1' => " + item.n }); return { ok: true }; }
        let msg = "";
        try { msg = (await response.json()).error || ""; } catch (_) {}
        console.error("Error sending to Firestore:", response.status, msg);
        if (response.status === 400 || response.status === 413 || response.status === 422) {
          M.toast({ html: "Error: " + (msg || "Unknown error from firebaseOrders function") });
          return { drop: true };
        }
        return {};
      } catch (err) {
        clearTimeout(timer);
        console.error("Error sending to Firestore:", err);
        return {};
      }
    }

    function scheduleRetry() {
      clearTimeout(retryTimer);
      retryTimer = setTimeout(pump, RETRY_MS[Math.min(Math.max(failures, 1), RETRY_MS.length) - 1]);
    }
    async function pump() {
      if (sending) return;
      sending = true;
      try {
        while (outbox.length) {
          if (navigator.onLine === false) { scheduleRetry(); break; }
          const item = outbox[0], r = await sendOne(item, outbox.length - 1);
          if (r.ok || r.drop) {
            failures = 0;
            outbox = outbox.filter(it => it.id !== item.id);
            saveOutbox();
            if (outbox.length) await sleep(SPACING_MS);
          } else {
            failures++;
            if (failures === 1) M.toast({ html: "No connection: " + outbox.length + " scan" + (outbox.length === 1 ? "" : "s") + " saved on this phone, will send when it is back" });
            scheduleRetry();
            break;
          }
        }
      } catch (e) { console.error("Outbox error:", e); scheduleRetry(); }
      sending = false;
    }
    // back online, the page shown again, a reload with scans still waiting, and a slow timer as the safety net
    window.addEventListener("online", () => { failures = 0; clearTimeout(retryTimer); pump(); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pump(); });
    window.addEventListener("pageshow", () => pump());
    setInterval(() => { if (outbox.length) pump(); }, 20000);
    loadOutbox();

    /*************************************************************
     * 7) CONFIG SYSTEM FOR LAYOUT REPOSITIONING
     *************************************************************/
    const scannerConfigComponentIDs = [
      "openConfigBtnScanner",
      "orderLabel",
      "orderNumInput",
      "qrPreviewTitle",
      "qrcode",
      "video",
      "captureCanvas",
      "sendBtn"
    ];
    let scannerDefaultPositions = {
      openConfigBtnScanner: { left:1600, top:2600, width:141, height:36 },
      orderLabel:           { left:70,   top:2450,  width:450, height:25 },
      orderNumInput:        { left:70,   top:2585,  width:450, height:75 },
      qrPreviewTitle:       { left:70,   top:2850,  width:350, height:25 },
      qrcode:               { left:70,   top:3000,  width:384, height:384 },
      video:                { left:0,    top:0,     width:1800, height:2400 },
      captureCanvas:        { left:400,  top:2600,  width:300, height:200 },
      sendBtn:              { left:1150, top:2820,  width:550, height:225 }
    };
    function loadPositionsFromStorage() {
      const stored = localStorage.getItem("scannerPositions");
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          for (let id of scannerConfigComponentIDs) {
            if (parsed[id]) {
              scannerDefaultPositions[id] = parsed[id];
            }
          }
        } catch(e) {
          console.warn("Could not parse scannerPositions from storage:", e);
        }
      }
    }
    function applyPositions() {
      scannerConfigComponentIDs.forEach(id => {
        const coords = scannerDefaultPositions[id];
        const el = document.getElementById(id);
        if (!coords || !el) return;
        el.style.position = "absolute";
        el.style.left   = coords.left + "px";
        el.style.top    = coords.top  + "px";
        el.style.width  = coords.width + "px";
        el.style.height = coords.height + "px";
      });
    }
    function scannerPopulateConfigTable() {
      const tbody = document.getElementById("configTableScanner").querySelector("tbody");
      tbody.innerHTML = "";
      scannerConfigComponentIDs.forEach(id => {
        const coords = scannerDefaultPositions[id];
        const el = document.getElementById(id);
        if (!coords || !el) return;
        const compName = (el.textContent && el.textContent.trim()) || el.placeholder || id;
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${compName}</td>
          <td><input type="number" value="${coords.left}" data-id="${id}" data-prop="left"></td>
          <td><input type="number" value="${coords.top}" data-id="${id}" data-prop="top"></td>
          <td><input type="number" value="${coords.width}" data-id="${id}" data-prop="width"></td>
          <td><input type="number" value="${coords.height}" data-id="${id}" data-prop="height"></td>
        `;
        tbody.appendChild(row);
        row.querySelectorAll("input").forEach(inp => {
          inp.addEventListener("input", function() {
            const tgtId = this.getAttribute("data-id");
            const prop = this.getAttribute("data-prop");
            const newVal = parseInt(this.value, 10) || 0;
            scannerDefaultPositions[tgtId][prop] = newVal;
            applyPositions();
          });
        });
      });
    }
    function scannerSaveConfiguration() {
      localStorage.setItem("scannerPositions", JSON.stringify(scannerDefaultPositions));
      console.log("Scanner layout saved!");
      M.toast({ html: "Scanner layout saved!" });
    }
    document.addEventListener("DOMContentLoaded", function() {
      // Initialize Materialize
      M.AutoInit();
      // Load and apply stored positions
      loadPositionsFromStorage();
      applyPositions();
      // Scans still waiting on this phone (offline, or the page reloaded mid-send) go on now
      pump();
      // Start the camera scanning automatically
      startCamera();
      // Hook up "Open Config" button to show config modal
      document.getElementById("openConfigBtnScanner").addEventListener("click", () => {
        scannerPopulateConfigTable();
        const modalElem = document.getElementById("configModalScanner");
        const instance = M.Modal.getInstance(modalElem);
        instance.open();
      });
      // Hook up "Save Config" button
      document.getElementById("saveConfigBtnScanner").addEventListener("click", scannerSaveConfiguration);
    });
  </script>
</body>
</html>
