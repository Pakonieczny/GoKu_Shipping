  force = true

# ─── Brites storefront automation — June 2026 ───────────────────────────────
# Self-running site fixes for britesjewelry.com (handle renames + redirects,
# pages, menus, checkout branding, custom labels, 14→30-day returns copy in
# product descriptions). Hourly until complete, then dormant via Firestore
# state (Brites_Editor_Meta/siteFixesState). Manual: POST with X-Edit-Passcode.
[functions."applySiteFixes"]
  schedule = "0 * * * *"

# Google Shopping recommended attributes (color per-variant from the metal,
# plus age_group="adult" and gender="unisex" at the product level), written
# into the mm-google-shopping metafield namespace the Google & YouTube channel
# reads. Cursor-paginated catalog walk; resumes each run; dormant once complete
# (Brites_Editor_Meta/googleAttributesState). Offset :15 so it never stacks with
# applySiteFixes (:00) or syncCharmSets (:30). No passcode; manual: ?run=now.
[functions."googleAttributes"]
  schedule = "15 * * * *"

# Verified charm-set metafields (brites.set) — full-catalog v3 data
# (verified-full-v3-2026-06-12: 2,231 products' sets + 395 clears = 2,626
# writes) from charmSetsData.js. Offset :30 so it never stacks with
# applySiteFixes. DATA_VERSION change auto-restarts the walk; dormant when
# done (Brites_Editor_Meta/charmSetsState).
[functions."syncCharmSets"]
  schedule = "30 * * * *"

# Best-sellers collection sync: membership + true sales-rank order + tags +
# bs_rank metafields. Weekly, Monday 05:00 UTC (overnight NA, mirroring the
# 04:00 listings-catalog convention).
[functions."syncBestSellers"]
  schedule = "0 5 * * 1"

# ─── Brites Ad Autopilot — June 2026 ────────────────────────────────────────
# Hourly kicker for the Google Ads autopilot (generate → deploy → measure →
# adapt). Decides which tasks are due by clock (cheap tasks — anomaly +
# offline-conversion upload — hourly; measure/mine/prune/event-generation
# daily at GADS_DAILY_HOUR; budget reallocation weekly on GADS_WEEKLY_DOW)
# and POSTs them to googleAdsAutopilot-background. Offset :45 so it never
# stacks with applySiteFixes (:00), googleAttributes (:15), or
# syncCharmSets (:30). Honors the kill switch + dry-run in
# Brites_GAds_Control — dormant until enabled. Console + manual run:
# GET/POST /.netlify/functions/googleAdsAutopilotKick (X-Edit-Passcode).
[functions."googleAdsAutopilotKick"]
  schedule = "45 * * * *"

